<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藥品冰箱溫度查核登錄表</title>
<style>
  :root{--ink:#1f2d33;--soft:#5d6c77;--line:#c9d3da;--band:#e9f7ef;--red:#c0392b;--blue:#1c5fb0;--brand:#0f7a86;--bg:#eef2f4;--card:#fff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  .wrap{max-width:1180px;margin:0 auto;padding:14px}
  .bar{background:linear-gradient(135deg,var(--brand),#0a5b64);color:#fff;border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .bar h1{font-size:17px;margin:0;font-weight:800}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ctrls select,.ctrls input{padding:8px 10px;border:none;border-radius:8px;font-size:14px;font-family:inherit}
  .btn{padding:8px 14px;border:none;border-radius:8px;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
  .btn-w{background:rgba(255,255,255,.2);color:#fff}
  .btn-p{background:var(--brand);color:#fff}
  .btn-g{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .sheet{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(20,40,55,.08);padding:14px;margin-top:14px;overflow:auto}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
  .head .hosp{font-weight:800;color:var(--red)}
  .head .ttl{font-weight:800;font-size:18px}
  .head .meta{font-weight:700}
  svg{display:block}
  .cell-hit{fill:transparent;cursor:pointer}
  .cell-hit:hover{fill:rgba(15,122,134,.10)}
  table.sig{border-collapse:collapse;font-size:11px;table-layout:fixed}
  table.sig td,table.sig th{border:1px solid var(--line);text-align:center;padding:2px;overflow:hidden}
  table.sig th{background:#f4f7f9;font-weight:700;white-space:nowrap}
  table.sig td{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:1px;line-height:1.05;height:52px;vertical-align:top;padding-top:3px;margin:0 auto}
  .legend{font-size:12px;color:var(--soft);line-height:1.7;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .legend b{color:var(--ink)}
  .abn h3{margin:14px 0 8px;font-size:15px}
  table.abn-t{width:100%;border-collapse:collapse;font-size:13px}
  table.abn-t th,table.abn-t td{border:1px solid var(--line);padding:6px 8px;text-align:center}
  table.abn-t th{background:#f4f7f9}
  .pill{display:inline-block;font-weight:800;border-radius:6px;padding:1px 8px}
  .pA{background:#fdf3df;color:#b5680f}.pB{background:#fbe8e8;color:var(--red)}.pC{background:#e6f6ed;color:#1f9d57}
  .modal{position:fixed;inset:0;background:rgba(15,32,43,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal-card{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .modal-card h3{margin:0 0 12px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:13px;font-weight:700;color:var(--soft);margin-bottom:5px}
  .fld input,.fld select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .warn{background:#fbe8e8;color:var(--red);border:1px solid #f0c0c0;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:10px}
  .foot{display:flex;gap:10px;margin-top:6px}
  .superv{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
  .superv input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit}
  @media print{
    /* 列印時：工具列、所有標了 noprint 的區塊、按鈕一律隱藏。
       原本只寫 .legend .noprint，所以螢幕用的異常編輯表也會被印出來，
       跟上面格線裡的同一份資料重複印兩次。 */
    body{background:#fff}.bar,.noprint,.btn{display:none!important}
    .wrap{max-width:none;padding:0}.sheet{box-shadow:none;border-radius:0;overflow:visible}
    @page{size:A4 landscape;margin:8mm}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-w" onclick="goBack()" title="返回">←</button>
      <h1>🌡 藥品冰箱溫度查核登錄表</h1>
    </div>
    <div class="ctrls">
      <select id="unitSel"></select>
      <input id="unitCustom" placeholder="自訂單位名" style="width:130px;display:none">
      <input type="month" id="ymSel">
      <input id="empIn" placeholder="刷/輸入員編" inputmode="numeric" style="width:110px">
      <input id="nameIn" placeholder="簽名(自動帶入)" style="width:110px">
      <button class="btn btn-w" onclick="window.print()">🖨 列印</button>
      <button class="btn btn-w" onclick="exportCSV()">⤓ 匯出CSV</button>
    </div>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="modalHost"></div>

<script>
function goBack(){ try{ if(window.parent&&window.parent!==window){ window.parent.postMessage({cmd:'embedBack'},'*'); return; } }catch(e){} if(history.length>1) history.back(); else location.href='index.html'; }
const HOSP="嘉義基督教醫院";
const ROSTER={"05845":"翁秀霞","06843":"方宏榮","03451":"陳子瑄","03746":"蔡佳娟","03838":"林素娥","05049":"康家瑜","05223":"楊嘉彤","11230":"李雅筑","11231":"蔡孟容","11304":"林昱庭","11562":"江沛鄉","11779":"董素惠","11849":"許佩珊","11872":"劉逸靚","11921":"畢宥頣","11957":"張舜硯","12049":"王孝彰","12243":"吳鈺珊","12346":"蔡婷瑋","12375":"王鈺茵","12524":"松韻嬋","12814":"吳秉訓","13109":"楊琇涵","13235":"吳家儀","13237":"郭馥瑄","13610":"蔡依伶","13712":"蘇佩如","13959":"洪詣婷","13965":"張祺勝","13969":"陳曉君","13974":"熊宜珊","14042":"林伯雄","14071":"謝琪文","14124":"何妍芝","14376":"曾鈺涵","14385":"黃堯","14403":"蕭筑云","14870":"李宜靜","15087":"林培琪","15260":"劉彩晶","15421":"張婉慈","15453":"王品琁","15569":"吳詠蓁","15594":"丁子傑","15682":"張荃茵","15727":"高若堇","15774":"陳永軒","15801":"洪芯綺","16063":"陳奕伶","16083":"黃書瑋","16098":"陳志凱","16104":"林乃嘉","16124":"賴郁佳","16125":"陳明君","16174":"蔡佩蓉","16199":"林以馨","16264":"劉玥澤","16267":"郭建良","16298":"蕭旆塏","16365":"何孟婷","16433":"楊子謙","16480":"黃晟凱","16493":"葉孟勳","16497":"凃維禎","16533":"洪莉婷","16538":"吳薏昕","16543":"王鈺鴻","16592":"林雅筑","16686":"黃冠菱","16536":"沈欣禹","16537":"邱琬心","16552":"吳槿葳","15757":"謝環憶","15829":"黃銘偉","15842":"蔡旻芳","16097":"葉俊德","16613":"蕭琇皣","16720":"羅勤祐","02907":"張秀月","12706":"陳盈利","15896":"龔鈺雯"};
function empName(v){return ROSTER[String(v||'').trim()]||'';}
const UNITS=["兒童檢傷 藥品冰箱（PT）","留觀 藥品冰箱","急救室 藥品冰箱","治療區 藥品冰箱"];
const SHIFTS=["0","8","16"];
const TMIN=0,TMAX=10,LOW=2,HIGH=8;
const AXISW=64, COLW=22, ROWH=24, PADTOP=14, PLOTH=(TMAX-TMIN)*ROWH;   // 左欄要放得下「主管查核／日期」與「異常狀況處理」群組
// 點班系統同一後端（拍照判讀 + 溫度寫回）
const API_URL='https://script.google.com/macros/s/AKfycbzTv13UdRLJWLEgZE1ExCp9ub_u_fi_pYxCA6ndTNT-K7zCP1Ra-wf9jfnqwgG2fKMJmg/exec';
// 這份前端搭配的後端版本；不一致代表 GS 沒重新部署
const APP_VER='2026-09-18-b37';   // 前端版本印記（畫面右下角會顯示）
const EXPECT_VER='2026-09-17-v21';

const P=new URLSearchParams(location.search);
let data=startData();

/* ★ 自動向後端同步（25 秒一次）＋ 切回這個分頁時立刻同步。
   別台剛登錄的溫度會自己出現，不必手動重整、也不會誤以為沒人登錄。
   還有未上傳的資料時不覆蓋（見 syncFromServer 內的保護）。 */
let SRV_AT=0;
async function autoSync(force){
  if(!API_URL)return;
  if(!force&&Date.now()-SRV_AT<20000)return;
  SRV_AT=Date.now();
  await syncFromServer();
}

/* ★★★ 啟動程序移到整份程式的最後面（見檔尾 boot()）。
   原本這裡就直接呼叫 syncFromServer() 與 syncBanner()，
   但它們用到的 serverCount（第 210 行 let）與 WQ（第 362 行 const）
   都宣告在後面 —— JS 的 let/const 在宣告前存取會直接拋
   「Cannot access 'serverCount' before initialization」。
   結果 syncFromServer() 每次載入都在第一行就死掉，
   從來沒有真的讀過後端 → 徽章永遠顯示「後端 0 筆」，
   於是讓人以為沒存到、又重新存一次。這是冰箱溫度不一致的另一個獨立原因。 */

function keyOf(){return 'fridge_'+data.unit+'_'+data.ym;}
function blank(unit,ym){return {unit,ym,readings:{},abn:{},superv:[]};}
function loadFor(unit,ym){ try{const s=localStorage.getItem('fridge_'+unit+'_'+ym);if(s)return JSON.parse(s);}catch(e){} return blank(unit,ym); }
/* ★ 一律用台北時間，不看裝置時區。
   出過的問題：早上 11:22 卻被判成大夜班 —— 因為 getHours() 讀的是裝置設定的時區，
   那台電腦還停在美國時區。日期也會整天差一天，於是「別台登錄了我這台看不到」。 */
function tpeParts(d){
  d = d || new Date();
  try{
    const f = new Intl.DateTimeFormat("en-CA",{ timeZone:"Asia/Taipei", hour12:false,
      year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    const o = {};
    f.formatToParts(d).forEach(function(p){ if(p.type!=="literal") o[p.type]=p.value; });
    const h = (o.hour==="24"?"00":o.hour);
    if(o.year&&o.month&&o.day&&h!==undefined)
      return { y:+o.year, m:+o.month, d:+o.day, h:+h, mi:+o.minute };
  }catch(e){}
  const t = new Date(d.getTime()+8*3600e3);
  return { y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate(), h:t.getUTCHours(), mi:t.getUTCMinutes() };
}
// 裝置時區與台北不一致時回傳裝置的 UTC 偏移（小時），一致則回 null
function tzMismatch(){ try{ const dev=-new Date().getTimezoneOffset()/60; return Math.abs(dev-8)>0.01?dev:null; }catch(e){ return null; } }
function thisYM(){const t=tpeParts();return t.y+'-'+String(t.m).padStart(2,'0');}
function startData(){
  // ★ 年月一定要有值。空字串會讓寫入的「年月」是空的、而且同步時永遠比對不到，
  //   造成本機看得到、別台看不到 —— 這是先前記錄不一致的真正原因。
  const u=P.get('unit')||UNITS[0], ym=(P.get('ym')||'').trim()||thisYM();
  const d=loadFor(u,ym); d.unit=u; d.ym=ym;
  if(P.get('name')) localStorage.setItem('fridge_lastName',P.get('name'));
  return d;
}
function save(){try{localStorage.setItem(keyOf(),JSON.stringify(data));}catch(e){}}

function initControls(){
  const us=document.getElementById('unitSel');
  const list=UNITS.slice(); if(data.unit&&list.indexOf(data.unit)<0)list.unshift(data.unit);
  us.innerHTML=list.map(u=>`<option>${u}</option>`).join('')+'<option value="__custom">＋自訂…</option>';
  us.value=data.unit||UNITS[0];
  us.onchange=()=>{ const cu=document.getElementById('unitCustom'); if(us.value==='__custom'){cu.style.display='';cu.focus();return;} cu.style.display='none'; switchTo(us.value,data.ym); };
  document.getElementById('unitCustom').onchange=e=>{ if(e.target.value.trim()) switchTo(e.target.value.trim(),data.ym); };
  const ym=document.getElementById('ymSel'); ym.value=data.ym||''; ym.onchange=()=>switchTo(data.unit,ym.value);
  const nm=document.getElementById('nameIn'); nm.value=localStorage.getItem('fridge_lastName')||''; nm.onchange=()=>localStorage.setItem('fridge_lastName',nm.value.trim());
  const emp=document.getElementById('empIn'); emp.oninput=()=>{ const n=empName(emp.value); if(n){ nm.value=n; localStorage.setItem('fridge_lastName',n); } };
}
function switchTo(unit,ym){ save(); data=loadFor(unit,ym||data.ym); data.unit=unit; if(ym)data.ym=ym; render(); syncFromServer(); }

function daysInMonth(ym){ if(!ym)return 31; const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function minguo(ym){ if(!ym)return {y:'',m:''}; const [y,m]=ym.split('-').map(Number); return {y:y-1911,m}; }
function yT(t){ return PADTOP + (TMAX-t)/(TMAX-TMIN)*PLOTH; }
function xCol(idx){ return AXISW + idx*COLW + COLW/2; }
// ★ 年月正規化：Sheet 可能把「2026-09」存成日期，讀回來會是 2026-09-01 之類。
// 一律取前 7 碼 yyyy-MM，兩邊比對才會一致。
function ymOf(v){
  var s=String(v==null?'':v).trim();
  var m=s.match(/^(\d{4})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2);
  return s;
}
function rkey(day,si){ return day+'_'+SHIFTS[si]; }

/* ===================== 個人簽名／印章圖 =====================
   紙本「主管查核／日期」那一格是簽名或蓋章，電子表只印名字，歸檔時看起來不一致。
   所以讓本人上傳一張簽名／印章圖，列印時畫在那一格。

   ★ 界線要講清楚：圖是「呈現」，不是「證據」。
     存起來的圖，任何能按到按鈕的人都能貼上去 —— 看起來更正式，
     證明力其實比「員編＋時間」弱。所以 superv 那筆紀錄照舊存員編與時間，
     圖只影響印出來的樣子。

   ★ 只有本人的圖會顯示：以員編為 key，畫的時候比對 sv.empId。
   ★ Google Sheets 單格上限 5 萬字元，所以上傳前一定要壓到 40KB 以內。 */
let SIGNIMG={};                     // 員編 → dataURL
/* 員編從網址帶進來（index.html 開這一頁時會加 &emp=）。
   ★ 沒有員編就不讓上傳簽名圖 —— 認不出是誰的圖，存下去也沒意義。 */
function myEmp(){ return String(P.get('emp')||'').trim(); }
function signOf(emp){ return SIGNIMG[String(emp||'').trim()]||''; }
async function loadSignImgs(){
  if(!API_URL) return;
  try{
    const r=await fetch(API_URL+'?table=staff_sign');
    const a=await r.json();
    if(!Array.isArray(a)) return;
    const m={};
    a.forEach(function(o){
      const e=String(o['員編']||o.empId||'').trim();
      const img=String(o['簽名圖']||o.image||'');
      if(e&&img.indexOf('data:image/')===0) m[e]=img;
    });
    SIGNIMG=m;
  }catch(e){ console.warn('讀簽名圖失敗（不影響其他功能）',e); }
}
/* 直接拍照上傳用：
   1) 先找出「印泥紅」或「筆跡黑」的像素，裁掉四周的紙（拍整張紙也沒關係）
   2) 紙的灰底一律洗成純白，只留下印章／簽名本身
   3) 再壓成 PNG。簽名是線條，PNG 比 JPEG 乾淨（不會有壓縮雜點）
   存不進去比畫質差難處理得多，所以寬度會一階一階往下退。 */
function signInkMap(im){
  const W0=900, s=Math.min(1,W0/im.width);
  const w=Math.max(1,Math.round(im.width*s)), h=Math.max(1,Math.round(im.height*s));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  g.drawImage(im,0,0,w,h);
  let d; try{ d=g.getImageData(0,0,w,h); }catch(e){ return null; }  // 跨來源圖會擋，退回原本做法
  const p=d.data;
  // 先量一次紙的亮度（取最亮的那群），暗到一定程度才算筆跡
  let mx=1;
  for(let i=0;i<p.length;i+=4){ const v=Math.max(p[i],p[i+1],p[i+2]); if(v>mx) mx=v; }
  const dark=mx*0.62;
  let x0=w,y0=h,x1=-1,y1=-1;
  const al=new Float32Array(w*h), hueR=new Uint8Array(w*h);
  for(let y=0,k=0;y<h;y++) for(let x=0;x<w;x++,k++){
    const i=k*4, R=p[i],G=p[i+1],B=p[i+2];
    const red=R-(G+B)/2, lum=(R*0.3+G*0.59+B*0.11);
    let a=0, isRed=0;
    if(red>14){ a=Math.min(1,(red-12)/45); isRed=1; }
    const ad=Math.min(1,(dark-lum)/(dark*0.45));
    if(ad>a){ a=ad; isRed=0; }
    if(a>0.06){ al[k]=a; hueR[k]=isRed;
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(x1<0) return null;                       // 整張都白的，交給原本做法
  // 留白要照「裁出來的大小」算，照整張紙算會把小印章的長寬比撐歪
  const pad=Math.max(2,Math.round(Math.max(x1-x0,y1-y0)*0.03));
  x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad);
  x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
  const cw=x1-x0+1, ch=y1-y0+1;
  if(cw<20||ch<12) return null;
  const oc=document.createElement('canvas'); oc.width=cw; oc.height=ch;
  const og=oc.getContext('2d'); const od=og.createImageData(cw,ch); const q=od.data;
  for(let y=0;y<ch;y++) for(let x=0;x<cw;x++){
    const k=(y+y0)*w+(x+x0), j=(y*cw+x)*4;
    // 濃淡切成 8 階：肉眼看不出來，但 PNG 會小很多（存得進 Sheets 單格）
    const a=Math.round(al[k]*8)/8;
    const ir=hueR[k]?196:26, ig=hueR[k]?32:26, ib=hueR[k]?38:30;
    q[j]  =255*(1-a)+ir*a;
    q[j+1]=255*(1-a)+ig*a;
    q[j+2]=255*(1-a)+ib*a;
    q[j+3]=255;
  }
  og.putImageData(od,0,0);
  return oc;
}
function signShrink(file){
  return new Promise(function(res,rej){
    const fr=new FileReader();
    fr.onload=function(){
      const im=new Image();
      im.onload=function(){
        let src=im, sw=im.width, sh=im.height;
        try{ const t=signInkMap(im); if(t){ src=t; sw=t.width; sh=t.height; } }catch(e){}
        const tries=[360,300,260,200,150];
        for(let i=0;i<tries.length;i++){
          const w=Math.min(tries[i],sw), h=Math.max(1,Math.round(sh*w/sw));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const g=c.getContext('2d');
          g.fillStyle='#fff'; g.fillRect(0,0,w,h);     // 透明底在列印時會變黑，先鋪白

/* ★★★ 為什麼要自己做逾時：fetch 沒有預設逾時。
   Apps Script 偶爾會「接了請求但不回應」，這時 await 會一直掛著，
   badge 就永遠停在「⏳ 正在讀取後端…」，看起來跟「很慢」一模一樣，
   實際上它永遠不會好 —— 這就是 2026-09-16 那張截圖的狀況。

// ★ 90 秒是「不要永遠掛著」的上限，不是預期等待時間（實測初次同步可能 40 秒）
const FETCH_MS=90000;
async function fetchT(url,ms){
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const t=ctl?setTimeout(function(){ try{ctl.abort();}catch(e){} },ms||FETCH_MS):null;
  try{
    const r=await fetch(url,Object.assign({cache:'no-store'},ctl?{signal:ctl.signal}:{}));
    if(t)clearTimeout(t);
    return r;
  }catch(e){
    if(t)clearTimeout(t);
    throw new Error((e&&e.name==='AbortError')?('後端超過 '+Math.round((ms||FETCH_MS)/1000)+' 秒沒有回應'):String(e&&e.message||e));
  }
}

function pick0(o,names){
  if(!o)return '';

    var v=o[names[i]];

}

    const txt=await r.text();
    let a=null; try{ a=JSON.parse(txt); }catch(e){}
    if(!Array.isArray(a)){
      /* ★ 最常見的兩種：部署時「誰可以存取」設成「只有我自己」→ 回的是 Google 登入網頁；
         或 GS 沒重新部署成新版本 → 回的是舊版格式。兩種都要講出來，不能只說失敗。 */
      srvErr = (r.status!==200) ? ('HTTP '+r.status)

             : '後端回傳格式不對');
      serverCount=-1; syncing=false; srvBadge(); console.error('後端回傳不是陣列',txt.slice(0,200)); return; }
    let n=0;
    a.forEach(function(o){
      const unit=String(o['單位']||o.unit||'');
      let ym=ymOf(o['年月']||o.ym||'');

      if(!ym){ const t=String(o['寫入時間']||o.at||''); const m=t.match(/^(\d{4})[-\/](\d{2})/); if(m)ym=m[1]+'-'+m[2]; }

         結果「後台有資料、畫面上大夜永遠空白」，白班小夜卻正常。

        hi: String(o['高溫']!==undefined?o['高溫']:(o.hi||'')),
        lo: String(o['低溫']!==undefined?o['低溫']:(o.lo||'')),
        sign:String(o['簽名']||o.sign||'')

    });

  }catch(e){ console.error('同步後端冰箱紀錄失敗（先用本機資料）',e);

function payloadOf(day,si){
  const r=data.readings[rkey(day,si)]||{};
  return {unit:data.unit,ym:data.ym,day:day,shift:SHIFTS[si],
          cur:r.cur,hi:r.hi,lo:r.lo,sign:r.sign,at:new Date().toISOString()};
}
function markState(k,st){                     // st: 'send' | 'ok' | 'fail'
  const r=data.readings[k]; if(!r)return;
  if(st==='ok'){ delete r._unsync; delete r._sending; }
  else if(st==='send'){ r._sending=true; }
  else { delete r._sending; r._unsync=true; }
  save();
}
// 對外入口：安排一次上傳（可重複呼叫，同一格只會有一個請求在飛）
function fridgeWrite(day,si){
  const k=rkey(day,si);
  WQ.pending[k]=payloadOf(day,si);            // 永遠以「最新輸入」為準
  markState(k,'send');
  pumpWQ(k);
  return Promise.resolve();                   // 不讓呼叫端等後端
}
async function pumpWQ(k){
  if(WQ.inflight[k])return;                   // 已經有一個在飛 → 它回來時會自動再送最新的
  const payload=WQ.pending[k]; if(!payload)return;
  delete WQ.pending[k];
  WQ.inflight[k]=true;
  let ok=false;
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({task:'fridge_temp',payload:payload})});
    const t=await res.text(); let j=null; try{j=JSON.parse(t);}catch(_){}
    ok=!!(j&&j.ok);
  }catch(e){ console.error('冰箱溫度寫回失敗',e); }
  WQ.inflight[k]=false;
  if(ok){
    WQ.backoff[k]=0;
    if(!WQ.pending[k]) markState(k,'ok');
  }else{
    markState(k,'fail');
    if(!WQ.pending[k]) WQ.pending[k]=payload;  // 沒有更新的內容就重送同一份
    const wait=Math.min((WQ.backoff[k]?WQ.backoff[k]*2:3000),60000);
    WQ.backoff[k]=wait;
    clearTimeout(WQ.timer[k]);
    WQ.timer[k]=setTimeout(function(){ pumpWQ(k); },wait);   // 自動重試，不用人工按
  }
  syncBanner(); render();
  if(WQ.pending[k]&&ok) pumpWQ(k);            // 期間又改過 → 立刻補送最新的
}
// 還在飛或還沒送成功的筆數
function pendingCount(){
  let n=0; for(const k in (data.readings||{})) if(data.readings[k]._sending||data.readings[k]._unsync) n++;
  return n;
}
// 未上傳筆數的示警橫幅 ＋ 一鍵重試
function unsyncList(){ const a=[]; for(const k in (data.readings||{})) if(data.readings[k]._unsync) a.push(k); return a; }
function syncBanner(){
  const nFail=unsyncList().length;
  const nSend=Object.keys(WQ.inflight).filter(function(k){return WQ.inflight[k];}).length;
  const n=nFail;
  let el=document.getElementById('syncBar');
  if(!n){ if(el)el.remove(); if(nSend)return; return; }
  if(!el){ el=document.createElement('div'); el.id='syncBar';
    el.style.cssText='background:#fbe8e8;color:#c0392b;border:1px solid #f0c0c0;border-radius:10px;'
      +'padding:10px 14px;margin:10px 0;font-size:13.5px;font-weight:700;display:flex;'
      +'gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap';
    const w=document.querySelector('.wrap'); const sh=document.getElementById('sheet');
    if(w&&sh)w.insertBefore(el,sh); else if(w)w.appendChild(el);
  }
  el.innerHTML=`<span>⚠ 有 ${n} 筆還沒上傳到後端（別台看不到）。系統會自動重試，資料不會遺失。</span>
    <button onclick="retrySync()" style="border:none;background:#c0392b;color:#fff;font-weight:800;
      padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit">立即重試</button>`;
}
// 手動重試：把未完成的重新排入佇列（背景送，不卡畫面）。平常不必按，會自動重試。
function retrySync(){
  const ks=unsyncList(); if(!ks.length)return;
  ks.forEach(function(k){ const p=String(k).split('_');
    WQ.backoff[k]=0; clearTimeout(WQ.timer[k]);
    fridgeWrite(+p[0], SHIFTS.indexOf(p[1])); });
  syncBanner();
}

function render(){
  document.getElementById('ymSel').value=data.ym||'';
  const days=daysInMonth(data.ym); const cols=days*3;
  /* 紙本在溫度圖下面還有五列，而且是跟日期／班別同一組格線：
       簽名 ／（異常狀況處理：處理代號・簽名・結果）／ 主管查核·日期
     原本這幾列是另外做成表格列在下面，欄位對不起來，稽核要自己數格子。
     現在一起畫進同一張 SVG，格線與上方完全對齊。 */
  const RS=34, RC=20, RA=30, RR=30, RV=26;        // 各列高度
  const BTOP=PADTOP+PLOTH+16;                     // 下方區塊起點（班別字下面）
  // 欄名照紙本折成兩行，才塞得進左欄（紙本也是折行寫的）
  const BOT=[['簽名',RS],['處理|代號',RC],['簽名',RA],['結果',RR],['主管查核|日期',RV]];
  const BH=BOT.reduce(function(a,x){return a+x[1];},0);
  const GLW=17;                                   // 「異常狀況處理」直書群組欄寬
  const W=AXISW+cols*COLW+8, H=BTOP+BH+14; const mg=minguo(data.ym);
  let g='';
  g+=`<rect x="${AXISW}" y="${yT(HIGH)}" width="${cols*COLW}" height="${yT(LOW)-yT(HIGH)}" fill="var(--band)"/>`;
  for(let t=TMAX;t>=TMIN;t--){ const y=yT(t); const isRed=(t===HIGH||t===LOW);
    g+=`<line x1="${AXISW}" y1="${y}" x2="${AXISW+cols*COLW}" y2="${y}" stroke="${isRed?'var(--red)':'#dde5ea'}" stroke-width="${isRed?2:1}"/>`;
    g+=`<text x="${AXISW-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5d6c77">${t}°C</text>`;
    if(t>TMIN){const yh=yT(t-0.5);g+=`<line x1="${AXISW}" y1="${yh}" x2="${AXISW+cols*COLW}" y2="${yh}" stroke="#eef3f6" stroke-width="1" stroke-dasharray="2 3"/>`;}
  }
  for(let d=0;d<=days;d++){ const x=AXISW+d*3*COLW; g+=`<line x1="${x}" y1="${PADTOP}" x2="${x}" y2="${PADTOP+PLOTH}" stroke="#9fb4c2" stroke-width="1.4"/>`; }
  for(let c=0;c<cols;c++){ if(c%3!==0){const x=AXISW+c*COLW;g+=`<line x1="${x}" y1="${PADTOP}" x2="${x}" y2="${PADTOP+PLOTH}" stroke="#eef3f6" stroke-width="1"/>`;} }
  for(let d=1;d<=days;d++){ const x0=AXISW+(d-1)*3*COLW;
    g+=`<text x="${x0+1.5*COLW}" y="${PADTOP-2}" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d33">${d}</text>`;
    for(let si=0;si<3;si++){ g+=`<text x="${x0+si*COLW+COLW/2}" y="${PADTOP+PLOTH+12}" text-anchor="middle" font-size="9" fill="#8894a0">${SHIFTS[si]}</text>`; }
  }
  const pts=[];
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++){ const r=data.readings[rkey(d,si)]; if(r&&r.cur!=null&&r.cur!==''){ const idx=(d-1)*3+si; pts.push([xCol(idx),yT(clampPlot(+r.cur))]); } }
  if(pts.length>1){ g+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>`; }
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++){
    const r=data.readings[rkey(d,si)]; if(!r)continue; const idx=(d-1)*3+si; const x=xCol(idx);
    if(r.cur!=null&&r.cur!==''){ const bad=(+r.cur<LOW||+r.cur>HIGH); g+=`<circle cx="${x}" cy="${yT(clampPlot(+r.cur))}" r="3" fill="${bad?'var(--red)':'var(--blue)'}"/>`;
      if(+r.cur>TMAX||+r.cur<TMIN) g+=`<text x="${x}" y="${yT(clampPlot(+r.cur))-6}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--red)">${r.cur}</text>`; }
    if(r.hi!=null&&r.hi!=='') g+=`<text x="${x}" y="${yT(clampPlot(+r.hi))+3}" text-anchor="middle" font-size="11" font-weight="800" fill="#b5680f">V</text>`;
    if(r.lo!=null&&r.lo!=='') g+=`<text x="${x}" y="${yT(clampPlot(+r.lo))+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#1c7ed6">∧</text>`;
  }
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++){ const idx=(d-1)*3+si; const x=AXISW+idx*COLW; g+=`<rect class="cell-hit" x="${x}" y="${PADTOP}" width="${COLW}" height="${PLOTH}" onclick="openEntry(${d},${si})"></rect>`; }

  /* ---------- 下方五列：跟紙本一樣，與上方共用同一組格線 ---------- */
  const yRow=[]; { let y=BTOP; BOT.forEach(function(r){ yRow.push(y); y+=r[1]; }); yRow.push(y); }
  const BBOT=yRow[yRow.length-1];
  // 橫線
  for(let i=0;i<yRow.length;i++){
    const heavy=(i===0||i===yRow.length-1);
    g+=`<line x1="0" y1="${yRow[i]}" x2="${AXISW+cols*COLW}" y2="${yRow[i]}" stroke="${heavy?'#9fb4c2':'#dde5ea'}" stroke-width="${heavy?1.4:1}"/>`;
  }
  /* 直線：每一班一格，日界加粗（跟溫度圖同一組）
     ★ 只畫到「主管查核／日期」那一列的上緣 —— 紙本那一列是每 7 天一大格，
       不是每天／每班一格（原稿 16～31 日整段只有 1 條直線，落在第 8 天）。 */
  for(let c=0;c<=cols;c++){ const x=AXISW+c*COLW; const day=(c%3===0);
    g+=`<line x1="${x}" y1="${BTOP}" x2="${x}" y2="${yRow[4]}" stroke="${day?'#9fb4c2':'#eef3f6'}" stroke-width="${day?1.4:1}"/>`; }
  // 主管查核那一列：每 7 天一格（1–7 / 8–14 / 15–21 / 22–28 / 29–月底）
  const WEEKS=[]; for(let d=1;d<=days;d+=7) WEEKS.push([d,Math.min(days,d+6)]);
  WEEKS.forEach(function(w){
    const x=AXISW+(w[0]-1)*3*COLW;
    g+=`<line x1="${x}" y1="${yRow[4]}" x2="${x}" y2="${BBOT}" stroke="#9fb4c2" stroke-width="1.4"/>`;
  });
  g+=`<line x1="${AXISW+cols*COLW}" y1="${yRow[4]}" x2="${AXISW+cols*COLW}" y2="${BBOT}" stroke="#9fb4c2" stroke-width="1.4"/>`;
  // 左側列名（用 | 折行，跟紙本一樣）
  BOT.forEach(function(r,i){
    const ls=String(r[0]).split('|');
    const y0=yRow[i]+r[1]/2+3.5-(ls.length-1)*5;
    let ts='';
    for(let k=0;k<ls.length;k++) ts+=`<tspan x="${AXISW-5}" dy="${k===0?0:10}">${ls[k]}</tspan>`;
    g+=`<text x="${AXISW-5}" y="${y0}" text-anchor="end" font-size="9.5" fill="#5d6c77">${ts}</text>`;
  });
  g+=`<line x1="${AXISW}" y1="${BTOP}" x2="${AXISW}" y2="${BBOT}" stroke="#9fb4c2" stroke-width="1.4"/>`;
  /* 「異常狀況處理」直書群組標籤，涵蓋 處理代號／簽名／結果 三列。
     ★ 放在最左邊（x=0），不可以跟右邊的欄名共用同一段寬度 ——
        之前兩者都畫在 AXISW-GLW..AXISW，字直接疊在一起看不懂。 */
  {
    const gy0=yRow[1], gy1=yRow[4], gx=0;
    g+=`<line x1="${gx}" y1="${gy0}" x2="${gx}" y2="${gy1}" stroke="#9fb4c2" stroke-width="1.4"/>`;
    g+=`<line x1="${gx}" y1="${gy0}" x2="${AXISW}" y2="${gy0}" stroke="#9fb4c2" stroke-width="1.4"/>`;
    g+=`<line x1="${gx}" y1="${gy1}" x2="${AXISW}" y2="${gy1}" stroke="#9fb4c2" stroke-width="1.4"/>`;
    const lbl='異常狀況處理', step=(gy1-gy0-8)/lbl.length;
    let ts='';
    for(let i=0;i<lbl.length;i++) ts+=`<tspan x="${gx+GLW/2}" dy="${i===0?0:step}">${lbl[i]}</tspan>`;
    g+=`<text x="${gx+GLW/2}" y="${gy0+step*0.95}" text-anchor="middle" font-size="8.5" fill="#5d6c77">${ts}</text>`;
  }
  // 簽名（直書，跟溫度點同一欄正下方）
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++){ const r=data.readings[rkey(d,si)]; if(!r||!r.sign)continue;
    const x=xCol((d-1)*3+si); const nm=String(r.sign); let ts='';
    for(let ci=0;ci<Math.min(nm.length,3);ci++){ ts+=`<tspan x="${x}" dy="${ci===0?0:10}">${esc(nm[ci])}</tspan>`; }
    g+=`<text x="${x}" y="${yRow[0]+11}" text-anchor="middle" font-size="9.5" fill="#23313b">${ts}</text>`;
  }
  // 異常三列：處理代號／簽名／結果，填在該班那一格
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++){
    const a=data.abn[d+'_'+SHIFTS[si]]; if(!a)continue;
    const x=xCol((d-1)*3+si);
    g+=`<text x="${x}" y="${yRow[1]+RC/2+4}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--red)">${esc(a.code||'')}</text>`;
    if(a.sign){ const nm=String(a.sign); let ts='';
      for(let ci=0;ci<Math.min(nm.length,3);ci++) ts+=`<tspan x="${x}" dy="${ci===0?0:9}">${esc(nm[ci])}</tspan>`;
      g+=`<text x="${x}" y="${yRow[2]+9}" text-anchor="middle" font-size="8.5" fill="#23313b">${ts}</text>`; }
    if(a.result){ const rs=String(a.result); let ts='';
      for(let ci=0;ci<Math.min(rs.length,3);ci++) ts+=`<tspan x="${x}" dy="${ci===0?0:9}">${esc(rs[ci])}</tspan>`;
      g+=`<text x="${x}" y="${yRow[3]+9}" text-anchor="middle" font-size="8.5" fill="#23313b">${ts}</text>`; }
  }
  /* 主管查核·日期：蓋在「那 7 天」的整格裡，不是那一天的格子。
     同一週查核兩次以上就並排放，不要疊在一起。 */
  {
    const byWeek={};
    (data.superv||[]).forEach(function(sv){
      const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(sv.date||'')); if(!m)return;
      if((m[1]+'-'+m[2])!==data.ym) return;
      const d=+m[3]; if(d<1||d>days) return;
      const wi=Math.floor((d-1)/7); if(wi>=WEEKS.length) return;
      (byWeek[wi]=byWeek[wi]||[]).push({sv:sv,d:d});
    });
    Object.keys(byWeek).forEach(function(k){
      const wi=+k, w=WEEKS[wi], list=byWeek[k];
      const x0=AXISW+(w[0]-1)*3*COLW, cw=(w[1]-w[0]+1)*3*COLW;
      const slot=cw/list.length;
      list.forEach(function(e,i){
        const cx=x0+slot*(i+0.5), img=signOf(e.sv.empId);
        const dtxt=(+data.ym.slice(5,7))+'/'+e.d;
        if(img){
          /* 有簽名圖就蓋圖（跟紙本一樣）：圖在左、日期在右，兩個都塞得下才這樣排 */
          const ih=RV-5;
          let iw=Math.min(slot*0.55, ih*3.2);
          const gap=4, dw=22;
          const bw=iw+gap+dw, bx=cx-bw/2;
          g+=`<image x="${bx}" y="${yRow[4]+2.5}" width="${iw}" height="${ih}"
                preserveAspectRatio="xMidYMid meet" href="${img}"/>`;
          g+=`<text x="${bx+iw+gap}" y="${yRow[4]+RV/2+3.5}" font-size="8.5" fill="#5d6c77">${esc(dtxt)}</text>`;
        }else{
          g+=`<text x="${cx}" y="${yRow[4]+RV/2+3.5}" text-anchor="middle" font-size="9" fill="#23313b">${esc(String(e.sv.sign||'').slice(0,4))}　${esc(dtxt)}</text>`;
        }
      });
    });
  }
  // 點格子可編輯（螢幕上用；列印時看不出差別）
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++){ const x=AXISW+((d-1)*3+si)*COLW;
    g+=`<rect class="cell-hit" x="${x}" y="${yRow[1]}" width="${COLW}" height="${yRow[4]-yRow[1]}" onclick="openAbn('${d}',${si})"></rect>`; }
  const sig='';

  const abnRows=Object.keys(data.abn).sort().map(k=>{ const a=data.abn[k]; const [d,s]=k.split('_');
    return `<tr><td>${d} 日 ${s} 時</td><td><span class="pill p${a.code}">${a.code}</span></td><td>${esc(a.sign||'')}</td><td>${esc(a.result||'')}</td>
      <td><button class="btn btn-g" style="padding:4px 10px" onclick="openAbn('${d}',${SHIFTS.indexOf(s)})">編輯</button></td></tr>`; }).join('');
  /* ★ 異常明細已經畫進上面的格線裡（跟紙本一樣）。
     這張表只留在螢幕上當編輯清單，列印時隱藏，免得同一份資料印兩次。 */
  const abnHtml=`<div class="abn noprint"><h3>異常狀況處理（溫度不在 2–8°C）· 螢幕編輯用</h3>
    <table class="abn-t"><tr><th>日期時段</th><th>處理代號</th><th>簽名</th><th>結果</th><th></th></tr>
    ${abnRows||'<tr><td colspan="5" style="color:#8894a0">目前無異常紀錄 🎉</td></tr>'}</table></div>`;

  const supRows=(data.superv||[]).map((s,i)=>`<span style="border:1px solid var(--line);border-radius:8px;padding:4px 10px">${esc(s.sign)} · ${esc(s.date)} <a href="#" onclick="delSup(${i});return false" style="color:var(--red);text-decoration:none">✕</a></span>`).join('');
  /* 紙本規定主管每 7 天要查核一次 —— 算給她看，超過就變紅，不要靠記憶。 */
  const svAll=(data.superv||[]).slice().sort(function(a,b){ return String(a.date)<String(b.date)?1:-1; });
  const lastSv=svAll[0];
  let dueTxt='';
  if(lastSv&&/^\d{4}-\d{2}-\d{2}$/.test(String(lastSv.date))){
    const p1=String(lastSv.date).split('-');
    const gap=Math.round((Date.now()-Date.UTC(+p1[0],+p1[1]-1,+p1[2]))/86400000);
    dueTxt=gap>7
      ? `<span style="color:var(--red);font-weight:800">已隔 ${gap} 天（超過 7 天）</span>`
      : `<span style="color:#1f7a43;font-weight:700">已隔 ${gap} 天</span>`;
  }else{
    dueTxt='<span style="color:var(--red);font-weight:800">本月尚未查核</span>';
  }
  const mySign=signOf(myEmp());
  const supHtml=`<div class="superv noprint">
     <div style="width:100%;margin-bottom:6px"><b>主管查核／日期（每 7 天一次）：</b>${dueTxt}</div>
     ${supRows||'<span style="color:#8894a0">本月尚無</span>'}
     <input id="supName" placeholder="主管簽名" style="width:100px"><input id="supDate" type="date" style="width:150px">
     <button class="btn btn-p" onclick="addSup()">＋ 查核</button>
     <span style="width:100%;height:1px"></span>
     <div style="width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
         background:#f4f7f9;border-radius:9px;padding:8px 10px">
       <b style="font-size:12.5px">我的簽名／印章圖</b>
       ${mySign?`<img src="${mySign}" alt="簽名" style="height:30px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px">`
               :'<span style="font-size:12.5px;color:#8894a0">尚未上傳（會改印名字）</span>'}
       <input id="signFile" type="file" accept="image/*" style="display:none" onchange="signUpload(this)">
       <button class="btn btn-w" onclick="document.getElementById('signFile').click()">${mySign?'換一張':'上傳'}</button>
       ${mySign?'<button class="btn btn-g" onclick="signClear()">移除</button>':''}
       <span style="font-size:11.5px;color:#8894a0;flex:1;min-width:220px">
         白紙上簽名或蓋章拍一張，裁到只剩簽名即可。只有你本人的圖會印在你查核的那一格；
         圖只是列印呈現，留證的是員編與查核時間。</span>
     </div></div>`;

  document.getElementById('sheet').innerHTML=`
    <div class="head">
      <div class="hosp">${HOSP}</div>
      <div class="ttl">藥品冰箱溫度查核登錄表</div>
      <div class="meta">單位：${esc(data.unit)}　${mg.y?('民國 '+mg.y+' 年 '+mg.m+' 月'):'（請選年月）'}</div>
    </div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>
    ${sig}${abnHtml}${supHtml}
    <div class="legend">
      ※ 溫度登錄：每班查核者需在上班前完成查檢溫度並登錄。※ 主管查核／日期：主管每星期需查核一次冰箱的保管記錄。<br>
      ※ 溫度呈現方式：高溫以「<b style="color:#b5680f">V</b>」、低溫以「<b style="color:#1c7ed6">∧</b>」、現在溫度以「<b style="color:var(--blue)">●</b>」在該溫度的中間虛線上標示，現在溫度須與前一班溫度連線，高、低溫不需連線（BR 疫苗冰箱配合疾管局規定，三種溫度均需連線）；大於 10℃ 或小於 0℃ 以數字書寫。<br>
      ※ 冷藏藥品冰箱溫度應保持在 <b>2-8℃</b> 範圍，不在 2-8℃ 範圍呈現處理情形：代號 <span class="pill pA">A</span>－溫度不在 2-8℃ 範圍（藥物需暫時移到管控於 2-8℃ 的非食物冰箱），30 分鐘內再檢查；
      代號 <span class="pill pB">B</span>－30 分鐘後未恢復 2-8℃ 已通知工務請修；代號 <span class="pill pC">C</span>－溫度恢復正常。<br>
      <span class="noprint" style="color:#8894a0">＊點溫度格輸入該班溫度；點下方「異常狀況處理」那三列可填處理代號／簽名／結果。資料同步寫回後端 Sheet(fridge_temp)。</span>
    </div>`;
  save();
}

/* ★ 班別可以在視窗裡改（跟氧氣表一樣）。
   原本班別是「你點到哪一格就是哪一班」，點錯就得關掉重點一次；
   而且交班前後最容易點錯隔壁那一格。 */
const SHIFT_NAME_F=['大夜 N（0–8）','白班 D（8–16）','小夜 E（16–24）'];
let _ENTRY={day:0,si:0};
function entryVals(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  return {cur:g('e_cur'),hi:g('e_hi'),lo:g('e_lo'),sign:g('e_sign'),emp:g('e_emp')};
}
function entrySetShift(si){
  const v=entryVals();                 // 先把打好的值收起來，換班別不要害人重打
  _ENTRY.si=si;
  openEntry(_ENTRY.day,si,v);
}
function entrySetDay(v){
  const d=Math.max(1,Math.min(31,parseInt(v,10)||_ENTRY.day));
  const vv=entryVals(); _ENTRY.day=d; openEntry(d,_ENTRY.si,vv);
}
function openEntry(day,si,keep){
  if(!data.ym){alert('請先選擇年月');return;}
  _ENTRY={day:day,si:si};
  const r0=data.readings[rkey(day,si)]||{};
  const r=keep?{cur:keep.cur,hi:keep.hi,lo:keep.lo,sign:keep.sign}:r0;
  const chips=SHIFT_NAME_F.map(function(nm,i){
    const on=(i===si);
    return '<button type="button" onclick="entrySetShift('+i+')" style="flex:1;min-width:0;padding:10px 6px;'
      +'font-size:13px;font-family:inherit;border-radius:9px;cursor:pointer;'
      +(on?'border:2px solid #0f7a86;background:#e3f0f1;color:#0b5a63;font-weight:700'
          :'border:1px solid #d7e2e1;background:transparent;color:inherit')+'">'+nm+'</button>';
  }).join('');
  document.getElementById('modalHost').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">
    <h3>溫度登錄　<span style="font-weight:400;font-size:14px;color:var(--soft)">${esc(data.unit)}</span></h3>
    <div class="fld">
      <label>日期與班別（點錯格子可以在這裡改）</label>
      <div class="row2" style="align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px">
          <input id="e_day" type="number" min="1" max="31" value="${day}" onchange="entrySetDay(this.value)"
            style="width:70px;text-align:center"><span style="font-size:14px">日</span>
        </div>
        <div style="font-size:12px;color:var(--soft)">${esc(String(data.ym||''))}</div>
      </div>
      <div style="display:flex;gap:6px">${chips}</div>
    </div>
    <div class="fld">
      <div class="row2">
        <button class="btn btn-g" style="flex:1;padding:12px" onclick="document.getElementById('photoCam').click()">📷 拍照判讀</button>
        <button class="btn btn-g" style="flex:1;padding:12px" onclick="document.getElementById('photoIn').click()">🖼 選圖判讀</button>
      </div>
      <input type="file" id="photoCam" accept="image/*" capture="environment" style="display:none" onchange="visionRead(this.files[0])">
      <input type="file" id="photoIn" accept="image/*" style="display:none" onchange="visionRead(this.files[0])">
      <div id="visionMsg" style="font-size:12px;color:var(--soft);margin-top:6px"></div>
      <button type="button" onclick="testBackend()" style="background:none;border:none;color:#0f7a86;font-size:12px;text-decoration:underline;padding:4px 0;cursor:pointer">🔧 測試後端連線</button>
      <button type="button" onclick="writeSelfTest()" style="background:none;border:none;color:#c0392b;font-size:12px;text-decoration:underline;padding:4px 0 4px 12px;cursor:pointer">🧪 寫入自我測試（資料存不進去時點這）</button>
      <div id="diagMsg" style="font-size:12px;color:var(--soft);white-space:pre-wrap;margin-top:2px"></div>
    </div>
    <div class="fld"><label>現在溫度（°C）＊必填</label><input id="e_cur" type="number" step="0.1" inputmode="decimal" value="${r.cur??''}" autofocus></div>
    <div class="row2">
      <div class="fld"><label>高溫 V（選填）</label><input id="e_hi" type="number" step="0.1" value="${r.hi??''}"></div>
      <div class="fld"><label>低溫 ∧（選填）</label><input id="e_lo" type="number" step="0.1" value="${r.lo??''}"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>刷/輸入員編</label><input id="e_emp" inputmode="numeric" placeholder="例：05845" oninput="document.getElementById('e_sign').value=empName(this.value)||document.getElementById('e_sign').value"></div>
      <div class="fld"><label>簽名（自動帶入）</label><input id="e_sign" value="${esc(r.sign||curName())}"></div>
    </div>
    <div id="e_confirm"></div>
    <div class="foot" id="e_foot">
      <button class="btn btn-g" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn btn-p" style="flex:1" onclick="askSave()">儲存</button>
    </div>
  </div></div>`;
}
/* ★ 存檔前先確認。
   會把「單位／哪一天／哪一班／溫度／簽名」整段唸給你看再存 ——
   因為點錯格子、存到別人那一班，事後從圖上很難發現。 */
function askSave(){
  const cur=(document.getElementById('e_cur').value||'').trim();
  if(cur===''){alert('請輸入現在溫度');return;}
  let hi=(document.getElementById('e_hi').value||'').trim();
  let lo=(document.getElementById('e_lo').value||'').trim();
  if(hi!==''&&lo!==''&&(+lo)>(+hi)){ const t=hi; hi=lo; lo=t; }
  const sign=(document.getElementById('e_sign').value||'').trim();
  const day=_ENTRY.day, si=_ENTRY.si;
  const old=data.readings[rkey(day,si)];
  const bad=(+cur<LOW||+cur>HIGH);
  const ex=document.getElementById('e_confirm');
  document.getElementById('e_foot').style.display='none';
  ex.innerHTML='<div style="border:2px solid #0f7a86;border-radius:10px;padding:12px;margin-top:10px;'
    +'background:#f2f8f8;line-height:1.8">'
    +'<div style="font-weight:700;font-size:14px;margin-bottom:6px">確認要存這一筆嗎？</div>'
    +'<div style="font-size:14px">'+esc(data.unit)+'　<b>'+esc(String(data.ym||''))+' / '+day+' 日</b>　'
    +'<b style="color:#0b5a63">'+esc(SHIFT_NAME_F[si])+'</b></div>'
    +'<div style="font-size:14px;margin-top:2px">現在 <b>'+esc(cur)+'℃</b>'
    +(hi!==''?('　高 '+esc(hi)+'℃'):'')+(lo!==''?('　低 '+esc(lo)+'℃'):'')
    +'　簽名 <b>'+esc(sign||'（未填）')+'</b></div>'
    +(old?'<div style="font-size:13px;color:#b5680f;margin-top:6px">⚠ 這一格原本已經有紀錄（'
        +esc(String(old.cur))+'℃・'+esc(old.sign||'')+'），存下去會覆蓋掉。</div>':'')
    +(bad?'<div style="font-size:13px;color:#c0392b;margin-top:6px">⚠ 溫度不在 '+LOW+'–'+HIGH
        +'℃，存完會接著要你填異常處理。</div>':'')
    +'<div class="foot" style="margin-top:10px">'
    +'<button class="btn btn-g" style="flex:1" onclick="cancelSave()">再修改</button>'
    +'<button class="btn btn-p" style="flex:1" onclick="doSave('+day+','+si+')">確認存檔</button>'
    +'</div></div>';
}
function cancelSave(){
  const ex=document.getElementById('e_confirm'); if(ex)ex.innerHTML='';
  const ft=document.getElementById('e_foot'); if(ft)ft.style.display='';
}
function doSave(day,si){
  const cur=document.getElementById('e_cur').value.trim();
  if(cur===''){alert('請輸入現在溫度');return;}
  const sign=document.getElementById('e_sign').value.trim();
  if(sign){ localStorage.setItem('fridge_lastName',sign); document.getElementById('nameIn').value=sign; }
  let hi=document.getElementById('e_hi').value.trim();
  let lo=document.getElementById('e_lo').value.trim();
  // 高低溫寫反就自動對調（曾出現低溫 24℃ / 高溫 5℃ 這種明顯顛倒的紀錄）
  if(hi!==''&&lo!==''&&(+lo)>(+hi)){ const t=hi; hi=lo; lo=t; }
  data.readings[rkey(day,si)]={cur:cur, hi:hi, lo:lo, sign:sign};
  save();
  /* ★ 立刻關窗、立刻顯示已登錄，上傳在背景進行（失敗會自動重試）。
     不再讓人停在「儲存中…」等後端 —— 那個等待就是重複存檔的元凶。 */
  fridgeWrite(day,si);
  if(+cur<LOW||+cur>HIGH){ closeModal(); openAbn(day,si,true); }
  else { closeModal(); render(); }
  syncBanner();
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; render(); }

function openAbn(day,si,fromEntry){
  const k=day+'_'+SHIFTS[si]; const a=data.abn[k]||{code:'A',sign:curName(),result:''}; const r=data.readings[k]||{};
  document.getElementById('modalHost').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card">
    <h3>異常狀況處理 · ${day} 日 ${SHIFTS[si]} 時</h3>
    ${fromEntry?`<div class="warn">現在溫度 ${esc(r.cur)}℃ 不在 2–8℃ 範圍，請登錄處理。</div>`:''}
    <div class="fld"><label>處理代號</label><select id="a_code">
      <option value="A"${a.code==='A'?' selected':''}>A · 溫度不在2-8℃，暫移至2-8℃冰箱，30分內再檢查</option>
      <option value="B"${a.code==='B'?' selected':''}>B · 30分後未恢復，已通知工務請修</option>
      <option value="C"${a.code==='C'?' selected':''}>C · 溫度恢復正常</option></select></div>
    <div class="fld"><label>簽名</label><input id="a_sign" value="${esc(a.sign||curName())}"></div>
    <div class="fld"><label>結果／備註</label><input id="a_result" value="${esc(a.result||'')}" placeholder="例：已回到2-8℃"></div>
    <div class="foot">
      ${data.abn[k]?`<button class="btn btn-g" style="flex:1" onclick="delAbn('${k}')">刪除</button>`:''}
      <button class="btn btn-p" style="flex:2" onclick="saveAbn('${k}')">儲存處理</button>
    </div>
  </div></div>`;
}
function saveAbn(k){ data.abn[k]={code:document.getElementById('a_code').value,sign:document.getElementById('a_sign').value.trim(),result:document.getElementById('a_result').value.trim()}; save(); closeModal(); }
function delAbn(k){ delete data.abn[k]; save(); closeModal(); }

function addSup(){
  const n=document.getElementById('supName').value.trim(), d=document.getElementById('supDate').value;
  if(!n||!d){alert('請填主管簽名與日期');return;}
  data.superv=data.superv||[];
  /* ★ 一定要記員編：那才是留證的東西，而且要靠它才知道該畫誰的簽名圖。 */
  data.superv.push({sign:n,date:d,empId:myEmp(),at:new Date().toISOString()});
  save(); render();
}
function delSup(i){ data.superv.splice(i,1); save(); render(); }

function exportCSV(){
  const days=daysInMonth(data.ym); let rows=[['日','時','現在溫度','高溫','低溫','簽名','異常代號','異常簽名','結果']];
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++){ const r=data.readings[rkey(d,si)]||{}; const a=data.abn[d+'_'+SHIFTS[si]]||{};
    if((r.cur!=null&&r.cur!=='')||a.code) rows.push([d,SHIFTS[si],r.cur||'',r.hi||'',r.lo||'',r.sign||'',a.code||'',a.sign||'',a.result||'']); }
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download=`藥品冰箱溫度_${data.unit}_${data.ym||''}.csv`; a.click(); URL.revokeObjectURL(url);
}

/* ★ 啟動：一定要放在所有 let/const 宣告之後，否則會踩到 TDZ（見上方說明） */
function boot(){
  initControls();
  render();
  syncBanner();
  srvBadge();                        // 先把徽章放上去，才看得到「正在讀取後端…」
  syncFromServer();
  /* 簽名圖另外抓：抓失敗只會變成「印名字」，不可以拖累溫度同步。 */
  loadSignImgs().then(function(){ render(); }).catch(function(){});
  setInterval(function(){ if(!document.hidden) autoSync(); },25000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) autoSync(true); });
  window.addEventListener('focus',function(){ autoSync(); });
}
boot();
</script>
</body>
</html>

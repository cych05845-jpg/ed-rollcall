  const host=document.getElementById('app'); if(!host) return;
  host.innerHTML=
   '<div style="max-width:520px;margin:36px auto;padding:0 20px;line-height:1.9;color:#16232b">'
   +'<div style="font-size:34px">🩹</div>'
   +'<h2 style="margin:6px 0;font-size:19px">程式打不開，但你的資料都還在</h2>'
   +'<div style="font-size:13.5px;color:#5a666e">這台裝置存的暫存壞掉了，清掉就會恢復。'
   +'<b>後端 Sheet 的資料完全不受影響</b>，其他人也不受影響。</div>'
   +(p?'<div style="margin-top:12px;padding:10px 12px;border-radius:9px;background:#fff4e6;'
      +'border:1px solid #ffd8a8;color:#b35309;font-size:13px">⚠ 這台還有<b>一筆點班紀錄沒送到後端</b>。'
      +'按下面的按鈕會先把它另存成備份再清暫存，不會直接弄丟。</div>':'')
   +'<button onclick="rescueReset()" style="width:100%;margin-top:16px;padding:14px;font-size:16px;'
   +'font-weight:800;border:none;border-radius:11px;background:#0f7a86;color:#fff;'
   +'font-family:inherit;cursor:pointer">清掉暫存並重新載入</button>'
   +'<details style="margin-top:16px;font-size:12px;color:#7a828b"><summary>錯誤訊息（回報用）</summary>'
   +'<pre style="white-space:pre-wrap;word-break:break-all">'+esc(String(err&&(err.stack||err.message||err)))+'</pre></details>'
   +'</div>';
}
function rescueReset(){
  try{ const s=localStorage.getItem('ed_rc2');
       const p=s?JSON.parse(s).rcPending:null;
       if(p) localStorage.setItem('ed_rc2_backup',JSON.stringify({at:new Date().toISOString(),rcPending:p}));
  }catch(e){}
  try{ localStorage.removeItem('ed_rc2'); }catch(e){}
  try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
         navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(x){ x.unregister(); }); });
  }catch(e){}
  setTimeout(function(){ location.reload(); },300);
}

// ---------- start ----------
applyTheme();
store.load();
if(!state.user)state.screen='login';
bootRender();
if(state.user){
  /* 開 App 時：沒手動挑過就用系統判斷（含 23:30 之後算隔天）；
     手動挑過而且還是同一個日曆日，就尊重他的選擇。 */
  if(!rcManualActive()) state.rcDate=rcDefaultDate();
  rebindForDate();
}
/* ★★★ 啟動分兩波，不要一次抓 12 張表。
   實測她的初次同步 39.9 秒 —— 慢的是 Apps Script 讀試算表，
   而那 39.9 秒裡有一大半花在「首頁根本用不到」的表上：
     devices（150 台儀器）、rtls（定位標籤）→ 只有定位畫面要，改成進那一頁才抓
     owed／item_report／fridge_temp／o2_check／cart_expiry → 首頁只看完成度，可以晚一點到
   第一波只抓「首頁要判斷完成度」的五張，抓完立刻可用；
   其餘在背景補齊，抓好再 render 一次。這樣「可以開始點班」的等待時間大幅縮短。 */
/* ★ v25：第一波只抓「今天＋昨天」的點班紀錄（首頁完成度、上一班未完成都只看這兩天），
   而且用 lite（不帶「逐項紀錄」那種長欄位）。其餘 7 天在第二波背景補。
   開 App 要等的那一下，就是這一波。 */
const BOOT_WAVE1=[['items'],['staff_perm'],['rollcall_active'],['rollcall_log',2,null,true],['cart_seal']];
/* 冰箱／氧氣開 App 就抓 30 天 —— 管理分析要看近 14 天登錄率，護理長也常直接翻整個月。
   它在第二波（背景）抓，不擋著開始點班。
   之後每 20 秒的自動更新只抓 3 天，但用「合併」寫回去，所以這 30 天不會被縮掉。 */
/* 第二波（背景，不擋畫面）：把點班紀錄補到 7 天。
   ★ 冰箱／氧氣只抓 3 天：首頁的「輔助單張」只看今天有沒有登錄。
     營運分析要的近 14 天，是在打開分析畫面時自己抓 30 天（openAnalytics），
     不必每個人一開 App 就先扛一份。o2_check 是全院科別 × 每天三班 × 六個評值項目，
     長得最快，抓 16 天大約 80KB、抓 3 天只要十幾 KB。 */
const BOOT_WAVE2=[['rollcall_log',7,null,true],['owed'],['item_report'],
                  ['fridge_temp',3],['o2_check',3],['cart_expiry'],['rollcall_issue',3]]
  .concat(MAINT_ON?[['device_maint',7]]:[]);
let BOOT_MS1=0, BOOT_MS2=0;
(async()=>{
  /* ★ 先用手機裡上次的資料畫畫面（幾乎瞬間），再去抓新的。
     沒有快取（第一次用、或換版本）就照舊等後端。 */
  const c=cacheRead();
  if(c){
    try{ await applyBundle(c.d); CACHE_AT=c.at; SHOW_CACHE=true; render(); }
    catch(e){ console.warn('快取套用失敗，改為等後端',e); }
  }
  const t0=Date.now();
  await loadBundle(BOOT_WAVE1);
  BOOT_MS1=Date.now()-t0;
  SHOW_CACHE=false; SYNC_AT=Date.now();
  render();                                   // ★ 到這裡就可以開始點班了
  const t1=Date.now();
  loadBundle(BOOT_WAVE2).then(function(){
    BOOT_MS2=Date.now()-t1; render();
  }).catch(function(e){ console.warn('第二波讀取失敗',e); });
})();
/* devices／rtls 只有定位畫面要用，改成「進那一頁才抓，而且只抓一次」。
   150 台儀器＋標籤是初次同步最大的一塊，首頁完全用不到。 */
let LOCATOR_LOADED=false, LOCATOR_LOADING=null;
function ensureLocator(){
  if(LOCATOR_LOADED) return Promise.resolve();
  if(LOCATOR_LOADING) return LOCATOR_LOADING;
  LOCATOR_LOADING=loadBundle([['devices'],['rtls']]).then(function(){
    LOCATOR_LOADED=true; LOCATOR_LOADING=null;
  }).catch(function(e){ LOCATOR_LOADING=null; throw e; });
  return LOCATOR_LOADING;
}
/* ★ 自動更新完成狀態。
   涵蓋首頁／分區／點班表／Leader 頁，且四張表（點班紀錄、進行中、冰箱、氧氣）一起抓。
   分頁切到背景時不跑，省流量；切回來會立刻補抓一次（見下方 visibilitychange）。

   ★ v24/b66：改成「看畫面決定頻率」。
     正在點班／看分區時，別人有沒有在點、有沒有點完，是當下就要知道的 → 20 秒。
     停在首頁或 Leader 頁時沒那麼急 → 60 秒。
     為什麼要改：每一次自動更新就是一次 Apps Script 請求，一個班十幾支手機掛著，
     等於後端每秒都在被叫；人在寫入時就得跟這些讀取搶同一個執行額度，回寫就變慢。 */
function syncEveryMs(){
  return (state.screen==='rollcall'||state.screen==='pick'||state.screen==='half'
          ||state.screen==='areas') ? 20000 : 60000;
}
/* ★★ v26：心跳（tick）—— 讓「別人點完了」在 8 秒內就看得到，又不會把後端叫爆。
   每 8 秒只問後端一個數字（最後一次寫入的時間戳，幾十個位元組）：
     沒變 → 什麼都不做（不抓任何資料）
     變了 → 立刻做一次完整同步
   為什麼不直接把同步改成 8 秒一次：那是每 8 秒抓 15~20KB，
   Apps Script 每天的執行時間是有上限的，十幾支手機掛著很快就燒完。
   ★ 後端還沒更新到 v26（不認得 ?tick=1）時會自動退回原本的 20／60 秒。 */
/* var 不用 let：syncAll() 在檔案前面就會用到 TICK_ON，用 let 會踩到 TDZ */
var TICK_V=null, TICK_BAD=0, TICK_ON=true, TICK_AT=0;
function tickEveryMs(){
  return (state.screen==='rollcall'||state.screen==='pick'||state.screen==='half'
          ||state.screen==='areas') ? 8000 : 20000;
}
async function tickCheck(){
  if(!TICK_ON||!API_URL||SYNCING) return;
  if(Date.now()-TICK_AT<tickEveryMs()-500) return;
  TICK_AT=Date.now();
  try{
    const r=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'tick=1&_='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(!j||j.v===undefined){ if(++TICK_BAD>=3) TICK_ON=false; return; }
    TICK_BAD=0;
    if(TICK_V===null){ TICK_V=String(j.v); return; }      // 第一次只記起來
    if(String(j.v)!==TICK_V){ TICK_V=String(j.v); syncAll(); }
  }catch(e){ if(++TICK_BAD>=3) TICK_ON=false; }
}
setInterval(function(){
  if(!state.user||SYNCING)return;
  if(document.hidden)return;
  if(!needsLiveSync())return;
  tickCheck();                                   // 8 秒問一次「有沒有人動過」
  /* 保底：就算心跳沒通（舊後端／掉封包），該來的完整同步還是會來。
     心跳有在運作時就把保底拉長 —— 反正有人寫入時心跳會馬上叫它同步。 */
  const floor=TICK_ON?(syncEveryMs()*3):syncEveryMs();
  if(Date.now()-SYNC_AT<floor-2000)return;
  syncAll();
},4000);

// 切回這個分頁／視窗重新取得焦點 → 立刻補抓一次，不用等 20 秒也不用手動按
document.addEventListener('visibilitychange',function(){
  if(document.hidden||!state.user||SYNCING)return;
  if(!needsLiveSync())return;
  if(Date.now()-SYNC_AT<3000)return;
  syncAll();
});
window.addEventListener('focus',function(){
  if(!state.user||SYNCING)return;
  if(!needsLiveSync())return;
  if(Date.now()-SYNC_AT<3000)return;
  syncAll();
});

// RTLS 每 2 分鐘自動刷新一次（僅在點班/首頁時，避免無謂流量）
setInterval(function(){
  if(!state.user)return;
  if(state.screen!=='rollcall'&&state.screen!=='home')return;
  loadRtls().then(function(){ if(state.screen==='rollcall'||state.screen==='home')render(); }).catch(function(){});
},120000);
</script>

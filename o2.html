<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氧氣桶安全維護審核標準</title>
<style>
  :root{--ink:#1f2d33;--soft:#5d6c77;--line:#333;--grid:#555;--brand:#0f7a86;--bg:#eef2f4;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",serif;background:var(--bg);color:var(--ink);font-size:15px}
  .wrap{max-width:1180px;margin:0 auto;padding:14px}
  .bar{background:linear-gradient(135deg,var(--brand),#0a5b64);color:#fff;border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .bar h1{font-size:17px;margin:0;font-weight:800}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ctrls select,.ctrls input{padding:8px 10px;border:none;border-radius:8px;font-size:14px;font-family:inherit}
  .btn{padding:8px 14px;border:none;border-radius:8px;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
  .btn-w{background:rgba(255,255,255,.2);color:#fff}
  .form{background:#fff;margin:14px auto;padding:10mm;box-shadow:0 1px 6px rgba(20,40,55,.12);max-width:297mm}
  .f-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .f-hosp{font-size:12px;font-weight:700;line-height:1.3}
  .f-hosp .en{font-size:9px;color:#444;font-weight:400}
  .f-rev{font-size:11px;color:#333}
  .f-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:3px;margin:2px 0 10px}
  .f-title .blank{display:inline-block;min-width:90px;border-bottom:1.5px solid #333;text-align:center}
  .crit{font-size:13px;line-height:1.9;margin:0 0 12px;padding:8px 10px;border:1px solid #999}
  .crit b{font-weight:800}
  table.o2{border-collapse:collapse;width:100%;table-layout:fixed}
  table.o2 th,table.o2 td{border:1px solid var(--grid);text-align:center;font-size:12px;height:30px;padding:0}
  table.o2 th.rowh{width:64px;font-weight:800;background:#f4f7f9}
  table.o2 th.dateh{font-weight:700}
  table.o2 th.sh{font-size:11px;font-weight:700;width:22px;color:#333}
  table.o2 td.cell{cursor:pointer}
  table.o2 td.cell:hover{background:rgba(15,122,134,.10)}
  table.o2 td.mk{color:#0a5b64;font-weight:800;font-size:15px}
  table.o2 td.note{cursor:pointer;font-size:11px;text-align:left;padding:2px 4px;white-space:nowrap;overflow:hidden}
  /* ★ 不用 writing-mode：表格格子裡的直書 Chrome 排不好，字會疊成一個（印出來只看到最後一個字）。
     改成一個字一行。 */
  table.o2 td.sigcell{font-size:11px;font-weight:700;color:#0a5b64;line-height:1.1;padding:2px 0;vertical-align:middle}
  .hint{font-size:12px;color:var(--soft);margin-top:8px}
  .qc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#eef6f7;border:1px solid #bfe0e3;border-radius:10px;padding:10px 12px;margin:0 0 12px}
  .qc select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit}
  .qc .go{background:var(--brand);color:#fff;border:none;font-weight:800;padding:11px 16px;border-radius:9px;cursor:pointer;font-size:15px}
  .wknav{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0 12px}
  .wknav button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 16px;font-family:inherit;font-weight:700;cursor:pointer;font-size:14px}
  .wknav button:disabled{opacity:.4}
  .o2scroll{overflow-x:auto}
  .screenview table.o2 td.cell{height:42px;min-width:26px}
  .screenview table.o2 th.sh{width:auto}
  .printview{display:none}
  .weekpage .f-top,.weekpage .f-title,.weekpage .crit{margin-top:0}
  @media print{
    body{background:#fff}.bar,.hint,.qc,.wknav,.screenview{display:none!important}
    .wrap{max-width:none;padding:0}.form{box-shadow:none;margin:0;max-width:none;padding:4mm}
    .printview{display:block!important}
    .weekpage{page-break-after:always}
    .weekpage:last-child{page-break-after:auto}
    @page{size:A4 landscape;margin:6mm}
  }
  /* 主管查核（螢幕操作區，列印時隱藏） */
  .superv{margin:12px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;
    border:1px solid #c9d3da;border-radius:10px;padding:10px 12px;background:#fbfcfd}
  .superv input{padding:8px 10px;border:1.5px solid #c9d3da;border-radius:8px;font-family:inherit}
  .superv .btn-p{background:var(--brand);color:#fff}
  .superv .btn-w{background:#fff;color:var(--ink);border:1.5px solid #c9d3da}
  .superv .btn-g{background:#fff;color:#c92a2a;border:1.5px solid #e0b4b4}
  .sv-chip{border:1px solid #c9d3da;border-radius:8px;padding:4px 10px;background:#fff}
  /* 一個班一個視窗：按鈕要大，手指點得到 */
  .sh-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0;padding:12px 12px;
    border:1.5px solid #c9d3da;border-radius:12px;background:#fff;font-family:inherit;font-size:14.5px;cursor:pointer}
  .sh-item.on{border-color:var(--brand);background:rgba(15,122,134,.10);font-weight:700}
  .sh-mk{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid #c9d3da;display:flex;align-items:center;
    justify-content:center;color:var(--brand);font-weight:800;font-size:16px;background:#fff}
  .sh-item.on .sh-mk{border-color:var(--brand)}
  .sh-tx{flex:1;line-height:1.45}
  table.o2 td.supcell{height:40px;text-align:left;padding:2px 6px}
  /* 簽名直書 2～3 個字，30px 高會溢到下一列（備註）去，印出來字被切一半 */
  table.o2 td.sigcell{height:46px}
  .sv-st{display:inline-flex;align-items:center;gap:4px;margin-right:14px;vertical-align:middle}
  .sv-st img{height:30px}
  .sv-st .d{font-size:11px;color:#444}
  @media print{.superv{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-w" onclick="goBack()" title="返回">←</button>
      <h1>🫧 氧氣桶安全維護審核標準</h1>
    </div>
    <div class="ctrls">
      <input id="deptIn" placeholder="科別（如 急診）" style="width:120px">
      <input type="month" id="ymSel">
      <input id="empIn" placeholder="刷/輸入員編" inputmode="numeric" style="width:110px">
      <input id="nameIn" placeholder="簽名(自動帶入)" style="width:110px">
      <button class="btn btn-w" onclick="printSheet()">🖨 列印</button>
      <button class="btn btn-w" onclick="exportCSV()">⤓ 匯出CSV</button>
    </div>
  </div>
  <div class="form" id="form"></div>
  <div class="hint wrap" style="padding:0 4px">＊點格子打勾（記錄簽名者，滑鼠移上去看是誰／何時）；備註列可輸入文字。資料會上傳後端，每 25 秒自動同步，別台登錄的也會出現。<br>＊評值項目文字如與貴院最新版有出入，告訴我我立即校正成一模一樣。</div>
</div>
<div id="modalHost"></div>

<script>
function goBack(){ try{ if(window.parent&&window.parent!==window){ window.parent.postMessage({cmd:'embedBack'},'*'); return; } }catch(e){} if(history.length>1) history.back(); else location.href='index.html'; }
const HOSP_ZH="財團法人　嘉義基督教醫院";
const HOSP_EN="CHIA-YI CHRISTIAN HOSPITAL";
const REV="103.03.25 修訂";
const SHIFTS=["N","D","E"];
const ROSTER={"05845":"翁秀霞","06843":"方宏榮","03451":"陳子瑄","03746":"蔡佳娟","03838":"林素娥","05049":"康家瑜","05223":"楊嘉彤","11230":"李雅筑","11231":"蔡孟容","11304":"林昱庭","11562":"江沛鄉","11779":"董素惠","11849":"許佩珊","11872":"劉逸靚","11921":"畢宥頣","11957":"張舜硯","12049":"王孝彰","12243":"吳鈺珊","12346":"蔡婷瑋","12375":"王鈺茵","12524":"松韻嬋","12814":"吳秉訓","13109":"楊琇涵","13235":"吳家儀","13237":"郭馥瑄","13610":"蔡依伶","13712":"蘇佩如","13959":"洪詣婷","13965":"張祺勝","13969":"陳曉君","13974":"熊宜珊","14042":"林伯雄","14071":"謝琪文","14124":"何妍芝","14376":"曾鈺涵","14385":"黃堯","14403":"蕭筑云","14870":"李宜靜","15087":"林培琪","15260":"劉彩晶","15421":"張婉慈","15453":"王品琁","15569":"吳詠蓁","15594":"丁子傑","15682":"張荃茵","15727":"高若堇","15774":"陳永軒","15801":"洪芯綺","16063":"陳奕伶","16083":"黃書瑋","16098":"陳志凱","16104":"林乃嘉","16124":"賴郁佳","16125":"陳明君","16174":"蔡佩蓉","16199":"林以馨","16264":"劉玥澤","16267":"郭建良","16298":"蕭旆塏","16365":"何孟婷","16433":"楊子謙","16480":"黃晟凱","16493":"葉孟勳","16497":"凃維禎","16533":"洪莉婷","16538":"吳薏昕","16543":"王鈺鴻","16592":"林雅筑","16686":"黃冠菱","16536":"沈欣禹","16537":"邱琬心","16552":"吳槿葳","15757":"謝環憶","15829":"黃銘偉","15842":"蔡旻芳","16097":"葉俊德","16613":"蕭琇皣","16720":"羅勤祐","02907":"張秀月","12706":"陳盈利","15896":"龔鈺雯"};
function empName(v){return ROSTER[String(v||'').trim()]||'';}
const CRIT=[["1a"],["1b"],["2a"],["2b"],["2c"],["3"]];
const SHIFT_NAME_O2=['大夜 N（0–8）','白班 D（8–16）','小夜 E（16–24）'];
const APP_VER='2026-09-24-b40';   // 前端版本印記（畫面右下角會顯示）
const EXPECT_VER='2026-09-24-v29';   // 後端應有的版本（?diag=1 可查）
const API_URL='https://script.google.com/macros/s/AKfycbzTv13UdRLJWLEgZE1ExCp9ub_u_fi_pYxCA6ndTNT-K7zCP1Ra-wf9jfnqwgG2fKMJmg/exec';

// （單筆寫入已併入下方的 o2WriteBatch 佇列，避免每勾一項就送一支請求）
/* ★ 一次寫多筆：原本「一鍵完成」會同時送出 6 支 POST，
   後端會平行跑 6 個執行環境、各自算 appendRow 的位置，互相搶同一列，
   甚至把資料寫到標題列上面（o2_check 第 1~3 列就是這樣被塞進資料的）。
   改成一支請求帶 items[]，後端一次寫完，不可能再搶。 */
/* ★ 同一天同一班只會有一個請求在飛；期間再勾選只會累加到待送清單，
   不會每勾一項就送一次（那樣後端會被 6 支平行請求灌爆，也是重複列的來源）。
   失敗自動重試（3→6→12…最多 60 秒），不必人工按重試。 */
const WQ={inflight:{},pending:{},timer:{},backoff:{}};
function gkeyOf(day,si){ return day+'|'+SHIFTS[si]; }
function o2WriteBatch(codes,day,si){
  if(!API_URL||!codes.length)return Promise.resolve();
  const g=gkeyOf(day,si);
  WQ.pending[g]=WQ.pending[g]||{};
  codes.forEach(function(c){ WQ.pending[g][c]=true;
    const k=ck(c,day,si); if(data.marks[k])data.marks[k]._sending=true; });
  save();
  pumpWQ(g,day,si);
  return Promise.resolve();          // 不讓呼叫端等後端
}
async function pumpWQ(g,day,si){
  if(WQ.inflight[g])return;
  const codes=Object.keys(WQ.pending[g]||{}); if(!codes.length)return;
  delete WQ.pending[g];
  WQ.inflight[g]=true;
  const mark=(bad)=>codes.forEach(c=>{const k=ck(c,day,si); const m=data.marks[k]; if(!m)return;
    delete m._sending; if(bad)m._unsync=true; else delete m._unsync;});
  let ok=false;
  const payload={dept:data.dept,ym:data.ym,day:day,shift:SHIFTS[si],qty:data.qty||'',
                 by:curName(),at:new Date().toISOString(),items:codes.slice()};
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({task:'o2_check_batch',payload:payload})});
    try{ if(typeof tickAlign==='function') tickAlign(); }catch(e){}
    const t=await res.text(); let j=null; try{j=JSON.parse(t);}catch(_){}
    ok=!!(j&&j.ok);
  }catch(e){ console.error('氧氣批次寫回失敗',e); }
  WQ.inflight[g]=false;
  mark(!ok);
  if(ok){ WQ.backoff[g]=0; }
  else{
    WQ.pending[g]=WQ.pending[g]||{};
    codes.forEach(function(c){ WQ.pending[g][c]=true; });
    const wait=Math.min((WQ.backoff[g]?WQ.backoff[g]*2:3000),60000);
    WQ.backoff[g]=wait;
    clearTimeout(WQ.timer[g]);
    WQ.timer[g]=setTimeout(function(){ pumpWQ(g,day,si); },wait);
  }
  save(); syncBanner(); render();
  if(ok&&WQ.pending[g]) pumpWQ(g,day,si);
}
/* ★ 取消打勾也要送後端（不然同步回來又長回去） */
async function o2DelBatch(codes,day,si){
  if(!API_URL||!codes.length) return {ok:false};
  const payload={dept:data.dept,ym:data.ym,day:day,shift:SHIFTS[si],qty:data.qty||'',
                 by:curName(),at:new Date().toISOString(),items:codes.slice()};
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({task:'o2_check_del',payload:payload})});
    try{ if(typeof tickAlign==='function') tickAlign(); }catch(e){}
    const t=await res.text(); let j=null; try{ j=JSON.parse(t); }catch(_){}
    if(j&&j.ok) return j;
    return {ok:false,error:(j&&j.error)||'後端沒有回 ok（GS 可能還不是 v28）'};
  }catch(e){ return {ok:false,error:String(e&&e.message||e)}; }
}
function unsyncList(){ const a=[]; for(const k in (data.marks||{})) if(data.marks[k]._unsync) a.push(k); return a; }
var O2_NOSTATE=false;                 // 後端讀回來的資料裡沒有「狀態」欄
function stateBanner(){
  let el=document.getElementById('noStateBar');
  if(!O2_NOSTATE){ if(el)el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='noStateBar';
    el.style.cssText='background:#fff4e6;color:#8a4b00;border:1px solid #ffd8a8;border-radius:10px;'
      +'padding:10px 14px;margin:10px 0;font-size:13px;line-height:1.7';
    const w=document.querySelector('.wrap'), fm=document.getElementById('form');
    if(w&&fm)w.insertBefore(el,fm); else if(w)w.appendChild(el); }
  el.innerHTML='⚠ <b>取消打勾會存進去、但讀不回來</b>：後端 o2_check 分頁的表頭少了「狀態」這一欄，'
    +'所以已經取消的格子同步回來又會打勾。<br>'
    +'請把 <b>dianban_api.gs</b> 更新到 <b>'+esc(EXPECT_VER)+'</b> 並「部署為新版本」'
    +'（v29 起會自動補欄名），或在編輯器執行一次 <b>fixHeads</b>。';
}
function syncBanner(){
  stateBanner();
  const n=unsyncList().length;
  let el=document.getElementById('syncBar');
  if(!n){ if(el)el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='syncBar';
    el.style.cssText='background:#fbe8e8;color:#c0392b;border:1px solid #f0c0c0;border-radius:10px;'
      +'padding:10px 14px;margin:10px 0;font-size:13.5px;font-weight:700;display:flex;'
      +'gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap';
    const w=document.querySelector('.wrap'); const fm=document.getElementById('form');
    if(w&&fm)w.insertBefore(el,fm); else if(w)w.appendChild(el);
  }
  el.innerHTML=`<span>⚠ 有 ${n} 筆只存在這台裝置，尚未上傳到後端（別台看不到）</span>
    <button onclick="retrySync()" style="border:none;background:#c0392b;color:#fff;font-weight:800;
      padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit">重試上傳</button>`;
}
// 手動重試：把未完成的重新排入佇列（背景送）。平常不必按，會自動重試。
function retrySync(){
  const ks=unsyncList(); if(!ks.length)return;
  const g={};
  ks.forEach(k=>{ const p=String(k).split('_'); const gk=p[1]+'|'+p[2]; (g[gk]=g[gk]||[]).push(p[0]); });
  for(const gk in g){ const p=gk.split('|');
    WQ.backoff[gk.replace('_','|')]=0;
    o2WriteBatch(g[gk], +p[0], SHIFTS.indexOf(p[1])); }
  syncBanner();
}

const P=new URLSearchParams(location.search);
let data=startData();

function keyOf(){return 'o2_'+(data.dept||'')+'_'+data.ym;}
function blank(dept,ym){return {dept,ym,marks:{},notes:{}};}
function loadFor(dept,ym){ try{const s=localStorage.getItem('o2_'+(dept||'')+'_'+ym);if(s)return JSON.parse(s);}catch(e){} return blank(dept,ym); }
/* ★ 一律用台北時間，不看裝置時區。
   出過的問題：早上 11:22 卻被判成大夜班 —— 因為 getHours() 讀的是裝置設定的時區，
   那台電腦還停在美國時區。日期也會整天差一天，於是「別台登錄了我這台看不到」。 */
function tpeParts(d){
  d = d || new Date();
  try{
    const f = new Intl.DateTimeFormat("en-CA",{ timeZone:"Asia/Taipei", hour12:false,
      year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    const o = {};
    f.formatToParts(d).forEach(function(p){ if(p.type!=="literal") o[p.type]=p.value; });
    const h = (o.hour==="24"?"00":o.hour);
    if(o.year&&o.month&&o.day&&h!==undefined)
      return { y:+o.year, m:+o.month, d:+o.day, h:+h, mi:+o.minute };
  }catch(e){}
  const t = new Date(d.getTime()+8*3600e3);
  return { y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate(), h:t.getUTCHours(), mi:t.getUTCMinutes() };
}
// 裝置時區與台北不一致時回傳裝置的 UTC 偏移（小時），一致則回 null
function tzMismatch(){ try{ const dev=-new Date().getTimezoneOffset()/60; return Math.abs(dev-8)>0.01?dev:null; }catch(e){ return null; } }
function thisYM(){const t=tpeParts();return t.y+'-'+String(t.m).padStart(2,'0');}
function startData(){
  // ★ 年月不可為空，否則寫入與同步都會對不起來（同 fridge.html）
  const dept=P.get('dept')||'', ym=(P.get('ym')||'').trim()||thisYM();
  const d=loadFor(dept,ym); d.dept=dept; d.ym=ym;
  if(P.get('qty')) d.qty=P.get('qty');
  if(P.get('name')) localStorage.setItem('o2_lastName',P.get('name'));
  return d;
}
function save(){try{localStorage.setItem(keyOf(),JSON.stringify(data));}catch(e){}}

function initControls(){
  const dp=document.getElementById('deptIn'); dp.value=data.dept||''; dp.onchange=()=>switchTo(dp.value.trim(),data.ym);
  const ym=document.getElementById('ymSel'); ym.value=data.ym||''; ym.onchange=()=>switchTo(data.dept,ym.value);
  const nm=document.getElementById('nameIn'); nm.value=localStorage.getItem('o2_lastName')||''; nm.onchange=()=>localStorage.setItem('o2_lastName',nm.value.trim());
  const emp=document.getElementById('empIn'); emp.oninput=()=>{ const n=empName(emp.value); if(n){ nm.value=n; localStorage.setItem('o2_lastName',n); } };
}
function switchTo(dept,ym){ save(); data=loadFor(dept,ym||data.ym); data.dept=dept; if(ym)data.ym=ym; SV_LOADED=false; O2_FULL_AT=0; render(); SRV_AT=0; autoSync(true); }

function daysInMonth(ym){ if(!ym)return 31; const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function minguo(ym){ if(!ym)return {y:'',m:''}; const [y,m]=ym.split('-').map(Number); return {y:y-1911,m}; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function curName(){return (document.getElementById('nameIn').value||'').trim();}
// ★ 年月正規化：Sheet 可能把「2026-09」存成日期，讀回來會是 2026-09-01 之類。
// 一律取前 7 碼 yyyy-MM，兩邊比對才會一致。
function ymOf(v){
  var s=String(v==null?'':v).trim();
  var m=s.match(/^(\d{4})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2);
  return s;
}

/* ===== 簽名／印章圖（與冰箱表共用後端 staff_sign，本人上傳一次兩張表都會用）===== */
let SIGNIMG={};                     // 員編 → dataURL
/* 員編從網址帶進來（index.html 開這一頁時會加 &emp=）。
   ★ 沒有員編就不讓上傳簽名圖 —— 認不出是誰的圖，存下去也沒意義。 */
function signOf(emp){ return SIGNIMG[String(emp||'').trim()]||''; }
/* ★ 簽名／印章圖一張就有 30~40KB，一個單位十幾個人就是好幾百 KB。
   它幾乎不會變 —— 存在本機，12 小時才重新抓一次。 */
const SIGN_CACHE_KEY='ed_sign_cache', SIGN_TTL=12*3600*1000;
function signCacheRead(){
  try{ const o=JSON.parse(localStorage.getItem(SIGN_CACHE_KEY)||'null');
    if(o&&o.at&&Date.now()-o.at<SIGN_TTL&&o.m) return o.m; }catch(e){}
  return null;
}
/* ★ v25：只抓「這張表上真的會蓋章的那幾個人」。
   整張 staff_sign 回傳 = 每個人 30~40KB × 全單位，十幾個人就是好幾百 KB，
   而畫面上通常只會用到護理長自己那一張。 */
function signNeededEmps(){
  const set={}; const me=myEmp(); if(me) set[me]=1;
  (data.superv||[]).forEach(function(s){ const e=String(s.empId||'').trim(); if(e) set[e]=1; });
  return Object.keys(set);
}
async function loadSignNeeded(){
  const need=signNeededEmps().filter(function(e){ return SIGNIMG[e]===undefined; });
  if(!need.length) return;
  await loadSignImgs(false,need);
  render();
}
async function loadSignImgs(force,emps){
  if(!API_URL) return;
  const c=signCacheRead();
  if(c&&!force){
    SIGNIMG=Object.assign({},c,SIGNIMG);
    // 需要的人都在本機那份裡就不用連後端
    if(!emps||emps.every(function(e){ return c[e]!==undefined; })) return;
  }
  try{
    const q=(emps&&emps.length)?('&emp='+encodeURIComponent(emps.join(','))):'';
    const r=await fetch(API_URL+'?table=staff_sign'+q);
    const a=await r.json();
    if(!Array.isArray(a)) return;
    const m={};
    a.forEach(function(o){
      const e=String(o['員編']||o.empId||'').trim();
      const img=String(o['簽名圖']||o.image||'');
      if(e&&img.indexOf('data:image/')===0) m[e]=img;
    });
    /* 沒有回傳的員編記成 ''（＝這個人沒有上傳過），才不會每次都再去問一次 */
    (emps||[]).forEach(function(e){ if(m[e]===undefined) m[e]=''; });
    SIGNIMG=Object.assign({},SIGNIMG,m);
    try{ localStorage.setItem(SIGN_CACHE_KEY,JSON.stringify({at:Date.now(),m:SIGNIMG})); }catch(e){}
  }catch(e){ console.warn('讀簽名圖失敗（不影響其他功能）',e); }
}
/* 直接拍照上傳用：
   1) 先找出「印泥紅」或「筆跡黑」的像素，裁掉四周的紙（拍整張紙也沒關係）
   2) 紙的灰底一律洗成純白，只留下印章／簽名本身
   3) 再壓成 PNG。簽名是線條，PNG 比 JPEG 乾淨（不會有壓縮雜點）
   存不進去比畫質差難處理得多，所以寬度會一階一階往下退。 */
function signInkMap(im){
  const W0=900, s=Math.min(1,W0/im.width);
  const w=Math.max(1,Math.round(im.width*s)), h=Math.max(1,Math.round(im.height*s));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  g.drawImage(im,0,0,w,h);
  let d; try{ d=g.getImageData(0,0,w,h); }catch(e){ return null; }  // 跨來源圖會擋，退回原本做法
  const p=d.data;
  // 先量一次紙的亮度（取最亮的那群），暗到一定程度才算筆跡
  let mx=1;
  for(let i=0;i<p.length;i+=4){ const v=Math.max(p[i],p[i+1],p[i+2]); if(v>mx) mx=v; }
  const dark=mx*0.62;
  let x0=w,y0=h,x1=-1,y1=-1;
  const al=new Float32Array(w*h), hueR=new Uint8Array(w*h);
  for(let y=0,k=0;y<h;y++) for(let x=0;x<w;x++,k++){
    const i=k*4, R=p[i],G=p[i+1],B=p[i+2];
    const red=R-(G+B)/2, lum=(R*0.3+G*0.59+B*0.11);
    let a=0, isRed=0;
    if(red>14){ a=Math.min(1,(red-12)/45); isRed=1; }
    const ad=Math.min(1,(dark-lum)/(dark*0.45));
    if(ad>a){ a=ad; isRed=0; }
    if(a>0.06){ al[k]=a; hueR[k]=isRed;
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(x1<0) return null;                       // 整張都白的，交給原本做法
  // 留白要照「裁出來的大小」算，照整張紙算會把小印章的長寬比撐歪
  const pad=Math.max(2,Math.round(Math.max(x1-x0,y1-y0)*0.03));
  x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad);
  x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
  const cw=x1-x0+1, ch=y1-y0+1;
  if(cw<20||ch<12) return null;
  const oc=document.createElement('canvas'); oc.width=cw; oc.height=ch;
  const og=oc.getContext('2d'); const od=og.createImageData(cw,ch); const q=od.data;
  for(let y=0;y<ch;y++) for(let x=0;x<cw;x++){
    const k=(y+y0)*w+(x+x0), j=(y*cw+x)*4;
    // 濃淡切成 8 階：肉眼看不出來，但 PNG 會小很多（存得進 Sheets 單格）
    const a=Math.round(al[k]*8)/8;
    const ir=hueR[k]?196:26, ig=hueR[k]?32:26, ib=hueR[k]?38:30;
    q[j]  =255*(1-a)+ir*a;
    q[j+1]=255*(1-a)+ig*a;
    q[j+2]=255*(1-a)+ib*a;
    q[j+3]=255;
  }
  og.putImageData(od,0,0);
  return oc;
}
function signShrink(file){
  return new Promise(function(res,rej){
    const fr=new FileReader();
    fr.onload=function(){
      const im=new Image();
      im.onload=function(){
        let src=im, sw=im.width, sh=im.height;
        try{ const t=signInkMap(im); if(t){ src=t; sw=t.width; sh=t.height; } }catch(e){}
        const tries=[360,300,260,200,150];
        for(let i=0;i<tries.length;i++){
          const w=Math.min(tries[i],sw), h=Math.max(1,Math.round(sh*w/sw));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const g=c.getContext('2d');
          g.fillStyle='#fff'; g.fillRect(0,0,w,h);     // 透明底在列印時會變黑，先鋪白
          g.drawImage(src,0,0,w,h);
          const url=c.toDataURL('image/png');
          if(url.length<=40000||i===tries.length-1) return res(url);
        }
      };
      im.onerror=function(){ rej(new Error('讀不到這張圖')); };
      im.src=fr.result;
    };
    fr.onerror=function(){ rej(new Error('檔案讀取失敗')); };
    fr.readAsDataURL(file);
  });
}
async function signUpload(input){
  const f=input.files&&input.files[0]; if(!f)return;
  input.value='';
  const emp=myEmp();
  if(!emp){ alert('看不到你的員編，無法認定這張圖是誰的。\n請從點班系統裡的入口進來（網址會帶員編）。'); return; }
  let url;
  try{ url=await signShrink(f); }
  catch(e){ alert('這張圖處理失敗：'+e.message); return; }
  if(url.length>45000){ alert('壓縮後還是太大。請裁掉空白、只留簽名的部分再試。'); return; }
  const r=await signWrite(emp,url);
  if(!r.ok){ alert('簽名圖沒有存進後端：\n'+(r.error||'連線失敗')); return; }
  SIGNIMG[emp]=url;
  try{ localStorage.setItem(SIGN_CACHE_KEY,JSON.stringify({at:Date.now(),m:SIGNIMG})); }catch(e){}
  render();
  alert('簽名圖已存好，之後主管查核那一格就會印出這張圖。\n\n'
    +'提醒：圖只是印出來好看，真正留證的是你的員編與查核時間。');
}
async function signWrite(emp,url){
  return postTask('sign_set',{empId:emp,name:svMyName(),image:url});
}
async function signClear(){
  const emp=myEmp(); if(!emp)return;
  if(!confirm('要移除你的簽名圖嗎？\n之後主管查核那一格會改成印名字。'))return;
  const r=await signWrite(emp,'');
  if(!r.ok){ alert('移除失敗：\n'+(r.error||'連線失敗')); return; }
  SIGNIMG[emp]='';
  try{ localStorage.setItem(SIGN_CACHE_KEY,JSON.stringify({at:Date.now(),m:SIGNIMG})); }catch(e){}
  render();
}

const SV_TYPE='o2';
function svUnit(){ return data.dept; }
function svYm(){ return ymOf(data.ym); }
function myEmp(){ return String(P.get('emp')||'').trim(); }
/* ===================== 主管查核（存後端 supervise_log）=====================
   ★ v22 之前冰箱的主管查核只存在那一支手機（localStorage）：
     手機上查核 → 護理站電腦列印，那一格是空的；「已隔 N 天」也只算得到本機。
   現在一律寫後端，冰箱與氧氣共用同一張表（類型 fridge／o2）。
   ★ 只記登入者本人：員編從網址帶進來（點班系統開這一頁時會加 &emp=），
     不再讓人自己打「主管簽名」—— 那一格打誰的名字都可以，等於沒有意義。
   ★ 只能撤銷自己的；撤銷不是刪列，後端會留「已刪除＋撤銷時間」。 */
let SV_LOADED=false;
function svToday(){ const t=tpeParts(); return t.y+'-'+String(t.m).padStart(2,'0')+'-'+String(t.d).padStart(2,'0'); }
function svMyName(){ return String(P.get('name')||'').trim()||(typeof curName==='function'?curName():''); }
/* ★ 主管查核只有主管能按（護理長／副護理長，或護理長在「權限設定」授權的代理人）。
   資格由點班系統開這一頁時用 &sup=1 帶進來；後端 v27 也會再擋一次 ——
   畫面只是不顯示按鈕，會改網址的人還是送得進來，而這一格是評鑑在看的。 */
function canSup(){ return String(P.get('sup')||'')==='1'; }
/* 所有寫後端的動作共用：把「為什麼失敗」翻成人看得懂的話。
   上次簽名圖「上傳失敗」卻看不出原因，就是因為這裡只會說「連線失敗」。 */
async function postTask(task,payload){
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({task:task,payload:payload})});
    try{ tickAlign(); }catch(e){}
    const t=await res.text(); let j=null; try{ j=JSON.parse(t); }catch(_){}
    if(!j) return {ok:false,error:/^\s*<(!doctype|html)/i.test(t)
      ?'後端回的是 Google 登入網頁 —— 部署時「誰可以存取」要選【任何人】'
      :'後端回傳看不懂（HTTP '+res.status+'）'};
    if(j.ok===true) return j;
    if(j.code==='unknown_task') return {ok:false,old:true,error:j.error};
    /* 舊版 GS 不認得的任務會掉進 AI 分支：回 {text:…} 或「尚未設定 GEMINI_KEY／額度用完」，沒有 ok */
    if(j.ok===undefined && (j.text!==undefined || /GEMINI|AI 額度/.test(String(j.error||''))))
      return {ok:false,old:true,error:'後端（GS）還是舊版，不認得「'+task+'」。\n'
        +'請把新的 dianban_api.gs 貼上 → 部署 → 管理部署 → ✏️ 編輯 → 版本選「新版本」→ 部署。'};
    return {ok:false,error:String(j.error||'後端沒有回 ok')};
  }catch(e){ return {ok:false,error:'連不上後端：'+String(e&&e.message||e)}; }
}
async function loadSuperv(){
  if(!API_URL||!svYm()) return;
  try{
    const r=await fetch(API_URL+'?table=supervise_log&days='+daysBackFor(data.ym,45)+'&_='+Date.now(),{cache:'no-store'});
    const a=await r.json(); if(!Array.isArray(a)) return;
    const srv=[];
    a.forEach(function(o){
      if(String(o['類型']||'')!==SV_TYPE) return;
      if(normU(o['單位'])!==normU(svUnit())) return;
      const d=String(o['日期']||'').slice(0,10);
      if(d.slice(0,7)!==svYm()) return;
      if(String(o['狀態']||'')==='已刪除') return;
      srv.push({sign:String(o['姓名']||''),date:d,empId:String(o['員編']||'').trim(),at:String(o['查核時間']||'')});
    });
    /* 本機有、後端沒有的：多半是 v22 之前存在這台的舊查核，或剛剛離線按的。
       是本人的就補傳；別人的留著但標「只在這台」，不可以默默丟掉。 */
    const loc=(data.superv||[]).filter(function(s){
      return !srv.some(function(m){ return m.date===s.date && m.empId===String(s.empId||''); }); });
    loc.forEach(function(s){ s._unsync=true; });
    data.superv=srv.concat(loc);
    SV_LOADED=true; save();
    const me=myEmp();
    loc.filter(function(s){ return me && String(s.empId||'')===me; }).forEach(function(s){ svPush(s,true); });
  }catch(e){ console.warn('讀主管查核失敗（不影響其他功能）',e); }
}
/* ★ 背景補傳要有煞車：後端是舊版時每 25 秒自動同步都會再送一次，
   舊版 GS 會把不認得的任務丟給 AI —— 每次都白燒額度。所以一個階段只試一次，
   而且只要後端回「舊版」就整個停掉，直到重新整理頁面。 */
let BG_TRIED={}, BG_OLD=false;
function bgOnce(key){ if(BG_OLD||BG_TRIED[key]) return false; BG_TRIED[key]=1; return true; }
async function svPush(rec,quiet){
  if(quiet && !bgOnce('sv|'+rec.date+'|'+rec.empId)) return false;
  const r=await postTask('superv_add',{type:SV_TYPE,unit:svUnit(),date:rec.date,empId:rec.empId,name:rec.sign});
  if(r.old) BG_OLD=true;
  if(r.ok){ delete rec._unsync; save(); render(); return true; }
  if(!quiet) alert('查核先存在這台，還沒進後端：\n'+r.error);
  return false;
}
async function addSup(){
  const emp=myEmp();
  if(!emp){ alert('看不到你的員編，無法記錄是誰查核的。\n請從點班系統裡的入口進來（網址會帶員編）。'); return; }
  if(!canSup()){ alert('主管查核限護理長／副護理長。\n需要代理時請護理長到「權限設定」勾選「主管查核」。'); return; }
  const el=document.getElementById('supDate');
  const d=(el&&el.value)||svToday();
  if(d.slice(0,7)!==svYm()){ alert('查核日期要在本月（'+svYm()+'）之內。'); return; }
  data.superv=(data.superv||[]).filter(function(s){ return !(s.date===d&&String(s.empId||'')===emp); });
  const rec={sign:svMyName(),date:d,empId:emp,at:new Date().toISOString(),_unsync:true};
  data.superv.push(rec); save(); render();           // 先顯示，再送後端
  await svPush(rec,false);
}
async function delSup(i){
  const s=(data.superv||[])[i]; if(!s) return;
  if(!canSup()){ alert('主管查核限護理長／副護理長。'); return; }
  /* ★ b40/b45：「只存在這台（_unsync）」的那一筆，任何主管都可以清掉。
     為什麼要開這個口：這種紀錄後端根本沒有（多半是 v22 以前留在這支手機上的舊查核）。
     loadSuperv 每次同步都會把它留下來，而舊規則又是「只能撤銷自己的」——
     別人的名字就永遠卡在這台機器上，刪不掉又一直印在表上。
     這個動作只動 localStorage，後端不會有任何變化，別人本來就看不到這一筆。 */
  if(s._unsync){
    if(!confirm('「'+(s.sign||'(未署名)')+' · '+s.date+'」只存在這台裝置，後端沒有這一筆。\n\n'
      +'要從這台移除嗎？\n（不會動到後端；別人本來就看不到，列印也不會印出來）')) return;
    data.superv.splice(i,1); save(); render(); return;
  }
  if(String(s.empId||'')!==myEmp()){ alert('只能撤銷你自己的查核。'); return; }
  if(!confirm('撤銷 '+s.date+' 的查核？\n（後端會留下撤銷紀錄）')) return;
  const r=await postTask('superv_del',{type:SV_TYPE,unit:svUnit(),date:s.date,empId:s.empId});
  if(!r.ok){ alert('撤銷失敗：\n'+r.error); return; }
  data.superv.splice(i,1); save(); render();
}
/* 螢幕上的查核區塊（列印時隱藏）。冰箱、氧氣共用。 */
function svPanelHtml(){
  const me=myEmp();
  const rows=(data.superv||[]).map(function(s,i){
    const mine=String(s.empId||'')===me;
    /* ★ 只在這台的那一筆：任何主管都可以按 ✕ 清掉（只動這台，後端不受影響）。
       而且要講清楚它不會印出來 —— 印出來的表就是正式紀錄，不可以印一筆後端沒有的查核。 */
    return '<span class="sv-chip">'+esc(s.sign||'(未署名)')+' · '+esc(s.date)
      +(s._unsync?' <b style="color:#c92a2a" title="後端沒有這一筆，列印不會印出來">⚠ 只在這台・不會列印</b>':'')
      +((mine||s._unsync)?' <a href="#" onclick="delSup('+i+');return false" style="color:#c92a2a;text-decoration:none" title="'+(s._unsync?'從這台移除':'撤銷')+'">✕</a>':'')
      +'</span>';
  }).join('');
  const all=(data.superv||[]).slice().sort(function(a,b){ return String(a.date)<String(b.date)?1:-1; });
  let due;
  if(all[0]&&/^\d{4}-\d{2}-\d{2}$/.test(all[0].date)){
    const p=all[0].date.split('-'), t=svToday().split('-');
    const gap=Math.round((Date.UTC(+t[0],+t[1]-1,+t[2])-Date.UTC(+p[0],+p[1]-1,+p[2]))/86400000);
    due=gap>7?'<span style="color:#c92a2a;font-weight:800">已隔 '+gap+' 天（超過 7 天）</span>'
             :'<span style="color:#1f7a43;font-weight:700">已隔 '+gap+' 天</span>';
  }else due='<span style="color:#c92a2a;font-weight:800">本月尚未查核</span>';
  const mySign=signOf(me);
  return '<div class="superv noprint">'
    + '<div style="width:100%;margin-bottom:6px"><b>主管查核／日期（每 7 天一次）：</b>'+due
    + (SV_LOADED?'':' <span style="color:#8894a0;font-size:12px">（讀取後端中…）</span>')+'</div>'
    + (rows||'<span style="color:#8894a0">本月尚無</span>')
    + (me
      ? (canSup()
          ? '<span style="font-size:13px">以 <b>'+esc(svMyName()||me)+'</b>（'+esc(me)+'）查核</span>'
            + '<input id="supDate" type="date" value="'+svToday()+'" style="width:150px">'
            + '<button class="btn btn-p" onclick="addSup()">＋ 查核</button>'

      : '<span style="font-size:12.5px;color:#c92a2a">要從點班系統的入口進來才能查核（需要員編）</span>')
    + '<span style="width:100%;height:1px"></span>'
    /* ★ 簽名／印章圖只有主管用得到（只有主管查核那一格會蓋圖），
       一般人員看得到查核紀錄，但不顯示上傳區，免得以為自己要傳。 */
    + (!canSup() ? '<div style="width:100%;font-size:12px;color:#8894a0">以上為主管查核紀錄（唯讀）。溫度／評值的登錄不受影響，照常填。</div>' :
      '<div style="width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f4f7f9;border-radius:9px;padding:8px 10px">'
    +   '<b style="font-size:12.5px">我的簽名／印章圖</b>'

               :'<span style="font-size:12.5px;color:#8894a0">尚未上傳（會改印名字）</span>')
    +   (me?'<input id="signFile" type="file" accept="image/*" style="display:none" onchange="signUpload(this)">'
          + '<button class="btn btn-w" onclick="document.getElementById(\'signFile\').click()">'+(mySign?'換一張':'上傳')+'</button>'
          + (mySign?'<button class="btn btn-g" onclick="signClear()">移除</button>':''):'')

    +     '圖只是列印呈現，留證的是員編與查核時間。</span>'
    + '</div>')

}

function ck(crit,day,si){return crit+'_'+day+'_'+SHIFTS[si];}
/* 從後端載入本科別本月已勾選的紀錄，與本機合併 → 換裝置看到的都一樣。
   ★ 原本這裡有三個毛病，造成「後台有資料但沒顯示」：
     ① 只有 n>0 才 render()，抓到 0 筆或抓失敗時畫面毫無反應，看起來像壞掉
     ② 完全沒有狀態提示。Apps Script 一次來回要 1~3 秒，這段空白期
        使用者只看到空表格，會以為沒同步（13:28 空白、13:29 才出現就是這個）
     ③ 沒有任何自動更新，別台登錄的永遠不會自己出現
   現在：進來就先顯示「正在讀取後端…」，抓完顯示筆數，之後每 25 秒自動更新。 */
let serverCount=null, syncing=false;
function srvBadge(){
  let el=document.getElementById('srvBadge');
  if(!el){ el=document.createElement('div'); el.id='srvBadge';
    el.style.cssText='font-size:12.5px;padding:6px 12px;margin:8px 0;border-radius:8px;display:inline-block;font-weight:700';
    const w=document.querySelector('.wrap'), sh=document.getElementById('sheet');
    if(w&&sh)w.insertBefore(el,sh); else if(w)w.insertBefore(el,w.firstChild); }
  const local=Object.keys(data.marks||{}).length;
  if(syncing){ el.style.background='#fff4e6'; el.style.color='#b5680f';
    el.textContent='⏳ 正在讀取後端…（本機 '+local+' 格）'; return; }
  if(serverCount===-1){ el.style.background='#fbe8e8'; el.style.color='#c0392b';
    el.textContent='⚠ 讀不到後端，畫面顯示的是本機資料（'+local+' 格）· 版本 '+APP_VER; return; }
  el.style.background='#e6f6ed'; el.style.color='#1f7a43';
  el.textContent='☁ 後端 '+(serverCount==null?'—':serverCount)+' 格 · 本機 '+local
    +' 格 · 本月 '+(data.ym||'')+' · 版本 '+APP_VER;
}
/* ★ v25：一進來先抓「最近 10 天」（＝正在看的這一週那一頁），其餘在背景補。
   原本是整張表抓回來 —— o2_check 是全院三個科別 × 每天三班 × 六個評值項目，長得最快。 */
/* ★ 「往回幾天」要看現在在看哪一個月：看的是本月就用 base 天，
   看更早的月份就要從今天回推到那個月的月初，否則 days 過濾會把整個月濾掉、畫面一片空白。 */
function daysBackFor(ym, base){
  var m=/^(\d{4})-(\d{2})$/.exec(String(ym||'')); if(!m) return base;
  var t=tpeParts();
  if(+m[1]===t.y && +m[2]===t.m) return base;
  var start=Date.UTC(+m[1],+m[2]-1,1), now=Date.UTC(t.y,t.m-1,t.d);
  var d=Math.round((now-start)/86400000)+35;
  return (d>0&&d<3000)?d:base;
}
const O2_FAST_DAYS=10, O2_FULL_DAYS=70;
let O2_FULL_AT=0;
async function syncFromServer(days){
  if(!API_URL)return;
  syncing=true; srvBadge();
  try{
    const r=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'table=o2_check&days='
      +daysBackFor(data.ym,(days||O2_FAST_DAYS))+'&_='+Date.now(),{cache:'no-store'});
    const a=await r.json();
    if(!Array.isArray(a)){ serverCount=-1; syncing=false; srvBadge();
      console.error('後端回傳不是陣列',a); return; }
    /* ★★★ b40：後端的 o2_check 分頁如果表頭少了「狀態」欄，取消打勾就會變成
       「Sheet 上寫著已刪除、手機上卻一直長回來」（2026-09-24 護理長踩到的）。
       原因在後端：舊分頁的表頭沒有跟著版本補欄，讀回來的資料裡整個沒有「狀態」。
       後端 v29 起會自動補；這裡留一道防線 —— 看不到「狀態」就講出來，不要靜靜地錯。 */
    O2_NOSTATE = a.length>0 && !a.some(function(o){ return Object.prototype.hasOwnProperty.call(o,'狀態'); });
    let n=0;
    a.forEach(function(o){
      const dept=String(o['科別']||o.dept||'');
      let ym=ymOf(o['年月']||o.ym||'');
      if(!ym){ const t=String(o['寫入時間']||o.at||''); const m=t.match(/^(\d{4})[-\/](\d{2})/); if(m)ym=m[1]+'-'+m[2]; }
      if(normU(dept)!==normU(data.dept)||ym!==ymOf(data.ym))return;
      const day=+(o['日']||o.day||0), sh=String(o['時段']||o.shift||''), crit=String(o['項目']||o.crit||'');
      const si=SHIFTS.indexOf(sh); if(!day||si<0||!crit)return;
      const k=ck(crit,day,si);
      n++;
      const local=data.marks[k];
      if(local&&(local._sending||local._unsync))return;      // 還沒上傳完的不要被後端蓋掉
      /* ★ v28：狀態「已刪除」＝有人取消過這一格，要當成沒打勾。
         以前後端沒有取消的機制，在手機上取消完，下一次同步又長回來 —— 使用者看到的就是「改不掉」。 */
      if(String(o['狀態']||'')==='已刪除'){ delete data.marks[k]; return; }
      data.marks[k]={ by:String(o['簽名']||o.by||''), at:String(o['寫入時間']||o.at||'') };
    });
    serverCount=n; syncing=false;
    save(); render(); srvBadge(); syncBanner();
  }catch(e){
    console.error('同步後端氧氣紀錄失敗（先用本機資料）',e);
    serverCount=-1; syncing=false; srvBadge();
  }
}
/* ★ 自動同步：每 25 秒 ＋ 切回分頁／取得焦點時立刻同步。
   別台剛登錄的會自己出現，不必手動重整。 */
let SRV_AT=0;
/* ★ 整個月「要用到才抓」：列印整月、或翻到比較前面的那幾週時才補。 */
async function o2FillFull(){
  if(Date.now()-O2_FULL_AT<10*60000) return;
  O2_FULL_AT=Date.now();
  try{ await syncFromServer(O2_FULL_DAYS); render(); }catch(e){ O2_FULL_AT=0; }
}
async function printSheet(){
  const b=document.getElementById('srvBadge');
  if(b) b.textContent='⏳ 正在補齊整個月的資料…';
  try{ await o2FillFull(); }catch(e){}
  srvBadge(); window.print();
}
/* 翻到「這一週的第一天比目前抓進來的還早」時，就把整個月補齊 */
function wkNeedsMore(c){
  if(!c||!c.length) return false;
  const t=tpeParts(), ym=data.ym||'';
  const p=ym.split('-').map(Number);
  if(!(p[0]===t.y&&p[1]===t.m)) return true;            // 不是本月 → 直接補
  return (t.d-c[0])>=O2_FAST_DAYS-1;                    // 這一週比抓進來的範圍還早
}
/* ★★ v26 心跳：每 10 秒只問後端一個數字（最後一次寫入的時間戳），
   沒變就什麼都不抓 —— 這一頁原本每 25 秒要抓 12~50KB，其實九成的時候資料根本沒變。
   後端還沒更新到 v26（不認得 ?tick=1）就自動退回原本的固定間隔。 */
var TICK_V=null, TICK_BAD=0, TICK_ON=true;
async function tickChanged(){
  if(!TICK_ON||!API_URL) return null;
  try{
    const r=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'tick=1&_='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(!j||j.v===undefined){ if(++TICK_BAD>=3) TICK_ON=false; return null; }
    TICK_BAD=0;
    const v=String(j.v);
    if(TICK_V===null){ TICK_V=v; return false; }     // 第一次只記起來
    if(v===TICK_V) return false;
    TICK_V=v; return true;
  }catch(e){ if(++TICK_BAD>=3) TICK_ON=false; return null; }
}
function tickAlign(){                                 // 自己寫完之後對齊，免得又同步一次
  if(!TICK_ON||!API_URL) return;
  fetch(API_URL+(API_URL.includes('?')?'&':'?')+'tick=1&_='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j&&j.v!==undefined) TICK_V=String(j.v); }).catch(function(){});
}
async function autoSync(force){
  if(!API_URL)return;
  if(!force){
    if(Date.now()-SRV_AT<9000) return;
    const ch=await tickChanged();
    if(TICK_ON&&ch===false&&Date.now()-SRV_AT<180000) return;
  }
  SRV_AT=Date.now();
  await syncFromServer();
  loadSuperv().then(render);
}
// 科別／單位名稱正規化，全形括號與空白差異不影響比對
function normU(v){ return String(v==null?'':v).replace(/[（]/g,'(').replace(/[）]/g,')').replace(/\s+/g,'').toUpperCase(); }

var wkIdx=null;
function monthChunks(){ const days=daysInMonth(data.ym); const a=[]; for(let s=1;s<=days;s+=7){const c=[];for(let d=s;d<=Math.min(s+6,days);d++)c.push(d);a.push(c);} return a; }
function defaultWk(){ const t=tpeParts(),ym=data.ym; if(ym){const[y,m]=ym.split('-').map(Number); if(t.y===y&&t.m===m)return Math.floor((t.d-1)/7);} return 0; }
function headBlock(mg){
  return `<div class="f-top">
      <div class="f-hosp">${HOSP_ZH}<br><span class="en">${HOSP_EN}</span></div>
      <div class="f-rev">${REV}</div></div>
    <div class="f-title">護理部－<span class="blank">${esc(data.dept||'')}</span>氧氣桶安全維護審核標準</div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
      <span>${data.qty?('應有氧氣桶數量：<b>'+esc(data.qty)+'</b> 支（請確認數量與功能）'):''}</span>
      <span>${mg.y?('民國 '+mg.y+' 年 '+mg.m+' 月'):'（請選年月）'}</span></div>
    <div class="crit"><b>評值項目：</b><br>
      1. 氧氣桶外觀：a. 懸掛氧氣流量使用參考表、b. 有懸掛「滿」或「空」掛牌<br>
      2. 氧氣桶功能：a. 打開氧氣桶時流量表有浮動、無破損、表接觸無漏氣、b. 關閉氧氣桶時桶壓與流量歸零、c. 壓力表保持 500psi(35kg/cm²) 以上（以下應以空桶處理）<br>
      3. 固定存放位置</div>`;
}
function chunkTable(daysArr){
  let h1='<tr><th class="rowh" rowspan="2">評值項目</th>';
  daysArr.forEach(d=> h1+=`<th class="dateh" colspan="3">${d}</th>`); h1+='</tr>';
  let h2='<tr>'; daysArr.forEach(()=>{ for(let si=0;si<3;si++) h2+=`<th class="sh">${SHIFTS[si]}</th>`; }); h2+='</tr>';
  let body='';
  CRIT.forEach(([code])=>{ body+=`<tr><th class="rowh">${code}</th>`;
    daysArr.forEach(d=>{ for(let si=0;si<3;si++){ const m=data.marks[ck(code,d,si)];
      /* ★ 格子只負責「打開那一班的視窗」，不再一點就改資料 ——
         這些格子在手機上只有十幾 px 寬，點錯的機率比點對還高。 */
      body+=`<td class="cell ${m?'mk':''}" title="${m?esc(m.by||'')+' '+esc(m.at||''):''}" onclick="openShift(${d},${si})">${m?'✓':''}</td>`; } });
    body+='</tr>'; });
  body+='<tr><th class="rowh">簽名</th>';
  daysArr.forEach(d=>{ for(let si=0;si<3;si++){ const by=o2SignOf(d,si);
    body+=`<td class="sigcell" title="${esc(by)}" onclick="openShift(${d},${si})">${Array.from(String(by).slice(0,3)).map(esc).join('<br>')}</td>`; } });
  body+='</tr>';
  body+='<tr><th class="rowh">備註</th>';
  daysArr.forEach(d=>{ const n=data.notes[d]||''; body+=`<td class="note" colspan="3" title="${esc(n)}" onclick="editNote(${d})">${esc(n)}</td>`; });
  body+='</tr>';
  /* ★ 主管查核／日期：一頁＝一週，所以這一列是整週合併成一格（跟冰箱表每 7 天一格同一個規則）。
     有本人簽名／印章圖就蓋圖，沒有就印名字；旁邊一定印日期。 */
  /* ★ 只存在這台（_unsync）的不印。印出來的表就是正式紀錄，
     後端沒有的查核不可以印上去 —— 畫面上的區塊會標「只在這台・不會列印」。 */
  const inWk=(data.superv||[]).filter(s=>!s._unsync).filter(s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s.date||''));
    return m && (m[1]+'-'+m[2])===ymOf(data.ym) && daysArr.indexOf(+m[3])>=0; })
    .sort((a,b)=>String(a.date)<String(b.date)?-1:1);
  const stamps=inWk.map(s=>{ const img=signOf(s.empId), d=+String(s.date).slice(8,10), m=+String(s.date).slice(5,7), y=+String(s.date).slice(0,4)-1911;
    return '<span class="sv-st">'+(img?'<img src="'+img+'" alt="'+esc(s.sign||'')+'">':'<b>'+esc(s.sign||'')+'</b>')
      +'<span class="d">'+y+'/'+m+'/'+d+'</span></span>'; }).join('');   // ★ 簽章日期帶民國年
  body+=`<tr><th class="rowh" style="font-size:11px;line-height:1.25">主管查核<br>日期</th><td class="supcell" colspan="${daysArr.length*3}">${stamps}</td></tr>`;
  return `<table class="o2">${h1}${h2}${body}</table>`;
}
function o2SignOf(d,si){ for(let i=0;i<CRIT.length;i++){ const m=data.marks[ck(CRIT[i][0],d,si)]; if(m&&m.by) return m.by; } return '';
}
function gotoWk(i){ const c=monthChunks(); if(i<0||i>=c.length)return; wkIdx=i; render();
  if(wkNeedsMore(c[i])) o2FillFull(); }
function quickDone(){
  if(!data.ym){alert('請先選年月');return;}
  const day=+document.getElementById('qcDay').value, sh=document.getElementById('qcShift').value, si=SHIFTS.indexOf(sh);
  const nm=curName(); if(nm)localStorage.setItem('o2_lastName',nm);
  const todo=[];
  CRIT.forEach(([code])=>{ const k=ck(code,day,si); if(!data.marks[k]){ data.marks[k]={by:nm,at:stamp()}; todo.push(code); } });
  save(); render();
  if(todo.length)o2WriteBatch(todo,day,si);      // ★ 一支請求送出全部，不再 6 支平行搶列
}
function render(){
  document.getElementById('ymSel').value=data.ym||'';
  const days=daysInMonth(data.ym), mg=minguo(data.ym);
  const chunks=monthChunks();
  if(wkIdx==null||wkIdx>=chunks.length) wkIdx=Math.min(defaultWk(),Math.max(0,chunks.length-1));
  const t=tpeParts();                     // ★ 預設的日與班別都以台北時間為準
  const defDay=(()=>{const ym=data.ym;if(ym){const[y,m]=ym.split('-').map(Number);if(t.y===y&&t.m===m)return t.d;}return chunks.length?chunks[wkIdx][0]:1;})();
  const defShift=(()=>{const h=t.h;return (h>=7&&h<15)?'D':(h>=15&&h<23)?'E':'N';})();
  const dayOpts=Array.from({length:days},(_,i)=>`<option ${(i+1)===defDay?'selected':''}>${i+1}</option>`).join('');
  const shOpts=SHIFTS.map(s=>`<option ${s===defShift?'selected':''}>${s}</option>`).join('');
  const qc=`<div class="qc"><b>快速完成</b>　日 <select id="qcDay">${dayOpts}</select>　班 <select id="qcShift">${shOpts}</select>
     <button class="go" onclick="quickDone()">✅ 本班全部正常（一鍵打勾）</button>
     <span style="font-size:12px;color:var(--soft)">有異常的項目再單獨點掉那一格</span></div>`;
  const cur=chunks.length?chunks[wkIdx]:[];
  const wknav=`<div class="wknav"><button onclick="gotoWk(${wkIdx-1})" ${wkIdx<=0?'disabled':''}>◀ 上週</button>
     <b>第 ${wkIdx+1} 週　${cur.length?(cur[0]+'–'+cur[cur.length-1]+' 日'):''}</b>
     <button onclick="gotoWk(${wkIdx+1})" ${wkIdx>=chunks.length-1?'disabled':''}>下週 ▶</button></div>`;
  const printAll=chunks.map((c,i)=>`<div class="weekpage">${headBlock(mg)}<div style="text-align:center;font-weight:700;margin:2px 0 6px">第 ${i+1} 週（${c[0]}–${c[c.length-1]} 日）</div>${chunkTable(c)}</div>`).join('');
  document.getElementById('form').innerHTML=`
    <div class="screenview">
      ${headBlock(mg)}
      ${qc}
      ${wknav}
      <div class="o2scroll">${chunkTable(cur)}</div>
      ${svPanelHtml()}
    </div>
    <div class="printview">${printAll}</div>`;
  save();
}
/* ===================== 一個班一個視窗 =====================
   ★ 為什麼要有這個視窗：表格一格只有十幾 px 寬，手指點下去很容易點到隔壁那一班、
     或隔壁那一項；而且以前「點一下就直接改資料」，點錯當下就寫進去了。
   現在：點格子 → 打開這一班的視窗（大按鈕）→ 看清楚再按「儲存」。
   沒有按儲存就什麼都不會變。 */
const CRIT_LABEL={
  '1a':'1a 懸掛氧氣流量使用參考表',
  '1b':'1b 有懸掛「滿」或「空」掛牌',
  '2a':'2a 打開時流量表有浮動、無破損、無漏氣',
  '2b':'2b 關閉時桶壓與流量歸零',
  '2c':'2c 壓力表 500psi(35kg/cm²) 以上',
  '3' :'3  固定存放位置'
};
let _SHIFT={day:0,si:0,pick:{},sign:null};
// 這一格原本存的是什麼（用來判斷「有沒有還沒存的更動」）
function shiftStored(day,si){
  const o={}; CRIT.forEach(function(c){ o[c[0]]=!!data.marks[ck(c[0],day,si)]; }); return o;
}
function shiftDirty(){
  const was=shiftStored(_SHIFT.day,_SHIFT.si);
  return CRIT.some(function(c){ return !!was[c[0]]!==!!_SHIFT.pick[c[0]]; });
}
function shiftNameOf(day,si){
  for(let i=0;i<CRIT.length;i++){ const m=data.marks[ck(CRIT[i][0],day,si)]; if(m&&m.by) return m.by; }
  return '';
}
function openShift(day,si){
  if(!data.ym){alert('請先選擇年月');return;}
  _SHIFT={day:day,si:si,pick:shiftStored(day,si),sign:null};
  shiftRender();
}
/* ★ 日期與班別可以在視窗裡改（跟冰箱那一頁一樣）。
   氧氣表一格很小，交班前後最容易點到隔壁那一班；原本點錯只能關掉重點一次。

   ★ 換格子的時候，已經勾的要不要跟著過去？問人，不要替人決定：
     - 還沒動過任何勾選 → 直接讀那一格已經有的紀錄，不囉唆。
     - 已經勾了但還沒存 → 問一次。要「帶過去」是因為常見情境就是
       「我勾好了才發現點錯格」；不帶就是單純看錯、想去看別格。
   不管哪一種，都還是要按「儲存」才會寫入。 */
function shiftGo(day,si){
  /* ★ 不可以寫 parseInt(day)||_SHIFT.day —— 打 0 的時候 0 是 falsy，會被吃掉。
     空白才回到原本那一天，打 0 或 99 是打錯，拉回 1～當月天數。 */
  var dn=parseInt(day,10);
  day=Math.max(1,Math.min(daysInMonth(data.ym), isNaN(dn)?_SHIFT.day:dn));
  si=Math.max(0,Math.min(2,si));
  if(day===_SHIFT.day&&si===_SHIFT.si){ shiftRender(); return; }
  let carry=false;
  if(shiftDirty()){
    carry=confirm('這一班已經勾了，但還沒儲存。\n\n'
      +'要把這些勾選帶到「'+day+' 日 · '+SHIFT_NAME_O2[si]+'」嗎？\n\n'
      +'確定＝帶過去（點錯格子時用這個）\n'
      +'取消＝不帶，改看那一格原本的紀錄');
  }
  const sign=(document.getElementById('sh_sign')||{}).value;
  _SHIFT={day:day,si:si,pick:carry?_SHIFT.pick:shiftStored(day,si),
          sign:carry?(sign!==undefined?sign:_SHIFT.sign):null};
  shiftRender();
}
function shiftSetDay(v){ shiftGo(v,_SHIFT.si); }
function shiftSetShift(si){ shiftGo(_SHIFT.day,si); }
// 重畫之前先把簽名欄收起來，否則勾一項就把人家打好的簽名洗掉
function shiftKeepSign(){ const el=document.getElementById('sh_sign'); if(el) _SHIFT.sign=el.value; }
function shiftToggle(code){ shiftKeepSign(); _SHIFT.pick[code]=!_SHIFT.pick[code]; shiftRender(); }
function shiftAll(v){ shiftKeepSign(); CRIT.forEach(function(c){ _SHIFT.pick[c[0]]=!!v; }); shiftRender(); }
function shiftRender(){
  const day=_SHIFT.day, si=_SHIFT.si;
  const nm=(_SHIFT.sign!==null&&_SHIFT.sign!==undefined)?_SHIFT.sign:(shiftNameOf(day,si)||curName());
  const rows=CRIT.map(function(c){
    const code=c[0], on=!!_SHIFT.pick[code];
    return `<button class="sh-item ${on?'on':''}" onclick="shiftToggle('${code}')">
      <span class="sh-mk">${on?'✓':''}</span><span class="sh-tx">${esc(CRIT_LABEL[code]||code)}</span></button>`;
  }).join('');
  const nOn=CRIT.filter(function(c){ return _SHIFT.pick[c[0]]; }).length;
  const chips=SHIFT_NAME_O2.map(function(t,i){
    const on=(i===si);
    return '<button type="button" onclick="shiftSetShift('+i+')" style="flex:1;min-width:0;padding:10px 6px;'
      +'font-size:13px;font-family:inherit;border-radius:9px;cursor:pointer;'
      +(on?'border:2px solid #0f7a86;background:#e3f0f1;color:#0b5a63;font-weight:700'
          :'border:1px solid #d7e2e1;background:transparent;color:inherit')+'">'+esc(t)+'</button>';
  }).join('');
  // 換過去的那一格已經有人點過的話要講一聲，免得蓋掉別人的
  const had=CRIT.filter(function(c){ return data.marks[ck(c[0],day,si)]; }).length;
  const who=shiftNameOf(day,si);
  const hadMsg=had?`<div style="font-size:12px;color:#8a4b00;margin-top:6px">
      這一格已經有紀錄：${who?esc(who)+'　':''}已勾 ${had}/${CRIT.length}　（按「儲存」會以目前畫面為準）</div>`:'';
  document.getElementById('modalHost').innerHTML=`<div style="position:fixed;inset:0;background:rgba(15,32,43,.45);
      display:flex;align-items:flex-end;justify-content:center;z-index:50" onclick="if(event.target===this)closeShift()">
    <div style="background:#fff;border-radius:16px 16px 0 0;max-width:520px;width:100%;padding:16px 16px 20px;max-height:92vh;overflow:auto">
      <h3 style="margin:0 0 2px;font-size:18px">氧氣桶審核　<span style="font-weight:400;font-size:14px;color:var(--soft)">${esc(data.dept||'')}</span></h3>
      <div style="font-size:12.5px;color:var(--soft);margin-bottom:10px">
        應有 ${esc(data.qty||'')} 支　已勾 ${nOn}/${CRIT.length}
        <span style="color:#8a4b00">　※ 按「儲存」才會寫入</span></div>
      <div style="margin-bottom:12px">
        <div style="font-size:13px;color:var(--soft);margin-bottom:6px">日期與班別（點錯格子可以在這裡改）</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:6px">
            <input id="sh_day" type="number" min="1" max="${daysInMonth(data.ym)}" value="${day}"
              onchange="shiftSetDay(this.value)"
              style="width:70px;text-align:center;padding:10px;border:1.5px solid #c9d3da;border-radius:10px;
                     font-size:16px;font-family:inherit"><span style="font-size:14px">日</span>
          </div>
          <div style="font-size:12px;color:var(--soft)">${esc(String(data.ym||''))}</div>
        </div>
        <div style="display:flex;gap:6px">${chips}</div>
        ${hadMsg}
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn" style="flex:1;background:#eef6f7;border:1.5px solid #bfe0e3" onclick="shiftAll(1)">全部正常</button>
        <button class="btn" style="flex:1;background:#fff;border:1.5px solid #e0b4b4;color:#c92a2a" onclick="shiftAll(0)">全部取消</button>
      </div>
      ${rows}
      <label style="display:block;margin:10px 0 0;font-size:13px">簽名
        <input id="sh_sign" value="${esc(nm)}" style="width:100%;padding:11px 12px;border:1.5px solid #c9d3da;border-radius:10px;font-size:16px;font-family:inherit;margin-top:4px"></label>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn" style="flex:1;background:#fff;border:1.5px solid #c9d3da" onclick="closeShift()">取消</button>
        <button class="btn" style="flex:2;background:var(--brand);color:#fff" onclick="shiftSave()">儲存</button>
      </div>
    </div></div>`;
}
function closeShift(){ document.getElementById('modalHost').innerHTML=''; }
async function shiftSave(){
  const day=_SHIFT.day, si=_SHIFT.si;
  const el=document.getElementById('sh_sign');
  const nm=(el&&el.value.trim())||curName();
  if(nm) localStorage.setItem('o2_lastName',nm);
  const add=[], del=[];
  CRIT.forEach(function(c){
    const code=c[0], k=ck(code,day,si), had=!!data.marks[k], want=!!_SHIFT.pick[code];
    if(want&&!had){ data.marks[k]={by:nm,at:stamp()}; add.push(code); }
    else if(!want&&had){ delete data.marks[k]; del.push(code); }
    else if(want&&had&&nm&&data.marks[k].by!==nm){ data.marks[k].by=nm; add.push(code); }  // 改簽名
  });
  closeShift(); save(); render();
  if(add.length) o2WriteBatch(add,day,si);
  if(del.length){
    const r=await o2DelBatch(del,day,si);
    if(!r.ok){
      alert('取消沒有存到後端，下次同步可能又會出現：\n'+(r.error||'連線失敗')
        +'\n（GS 需要更新到 v28 並「部署為新版本」）');
    }
  }
}
function stamp(){const t=tpeParts();return t.m+'/'+t.d+' '+String(t.h).padStart(2,'0')+':'+String(t.mi).padStart(2,'0');}
function editNote(day){
  const cur=data.notes[day]||'';
  document.getElementById('modalHost').innerHTML=`<div style="position:fixed;inset:0;background:rgba(15,32,43,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px" onclick="if(event.target===this)this.innerHTML=''">
    <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px">
      <h3 style="margin:0 0 12px">${day} 日 · 備註</h3>
      <input id="noteIn" value="${esc(cur)}" style="width:100%;padding:11px 12px;border:1.5px solid #c9d3da;border-radius:10px;font-size:16px;font-family:inherit" autofocus>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn" style="flex:1;background:#fff;border:1.5px solid #c9d3da" onclick="document.getElementById('modalHost').innerHTML=''">取消</button>
        <button class="btn" style="flex:1;background:#0f7a86;color:#fff" onclick="saveNote(${day})">儲存</button>
      </div></div></div>`;
}
function saveNote(day){ const v=document.getElementById('noteIn').value.trim(); if(v)data.notes[day]=v; else delete data.notes[day]; document.getElementById('modalHost').innerHTML=''; save(); render(); }
function exportCSV(){
  const days=daysInMonth(data.ym); const head=['評值項目'];
  for(let d=1;d<=days;d++)for(let si=0;si<3;si++)head.push(d+SHIFTS[si]);
  const rows=[head];
  CRIT.forEach(([code])=>{ const r=[code]; for(let d=1;d<=days;d++)for(let si=0;si<3;si++)r.push(data.marks[ck(code,d,si)]?'V':''); rows.push(r); });
  const nr=['備註']; for(let d=1;d<=days;d++){nr.push(data.notes[d]||'');nr.push('');nr.push('');} rows.push(nr);
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`氧氣桶審核_${data.dept||''}_${data.ym||''}.csv`;a.click();URL.revokeObjectURL(url);
}

/* ★ 啟動放在所有 let/const 宣告之後，避免「Cannot access X before initialization」
   （冰箱表就踩過這個坑：syncFromServer 每次載入都在第一行就死掉）。 */
function boot(){
  initControls();
  render();
  syncBanner();
  syncFromServer();                                  // ★ 一進來就抓，並顯示「正在讀取後端…」
  loadSuperv().then(function(){ render(); loadSignNeeded(); });
  setInterval(function(){ if(!document.hidden) autoSync(); },10000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) autoSync(true); });
  window.addEventListener('focus',function(){ autoSync(); });
}
// 前端版本印記：上傳後看不到這串就代表瀏覽器還在用舊檔
function verBadge(){
  let el=document.getElementById('verBadge');
  if(!el){ el=document.createElement('div'); el.id='verBadge';
    el.style.cssText='font-size:11.5px;color:#8894a0;margin:6px 0 0;text-align:right';
    const w=document.querySelector('.wrap'); if(w)w.appendChild(el); }
  el.textContent='前端版本 '+APP_VER;
}
boot();
</script>
